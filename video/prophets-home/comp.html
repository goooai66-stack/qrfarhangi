<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Cairo"; src: url(fonts/Cairo.ttf) format("truetype"); font-weight: 200 1000; }
@font-face { font-family: "Reem Kufi"; src: url(fonts/ReemKufi.ttf) format("truetype"); font-weight: 400 700; }
@font-face { font-family: "Amiri"; src: url(fonts/Amiri-Regular.woff) format("woff"); font-weight: 400; }
@font-face { font-family: "Amiri"; src: url(fonts/Amiri-Bold.woff) format("woff"); font-weight: 700; }
@font-face { font-family: "Noto Sans SC"; src: url(fonts/NotoSansSC-subset.woff2) format("woff2"); font-weight: 500 700; }
:root { --ink: #2a1d14; --terra: #c8553d; --teal: #0f5e63; --gold: #b07a14; --gold2: #e0a82e; --sand: #f6ead3; --paper: #fff8ea; --rose: #d98a7a; --cream: #fff6e3; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #ecd7b1; }
body { font-family: "Cairo", sans-serif; color: var(--ink); }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.a { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; }
.scn { position: absolute; inset: 0; }
.amiri { font-family: "Amiri", serif; font-weight: 700; }
.kufi { font-family: "Reem Kufi", sans-serif; font-weight: 700; }
.w { display: inline-block; }
.w.k { color: var(--terra); }
svg { overflow: visible; display: block; }
.chip { display: inline-flex; align-items: center; gap: 14px; background: var(--paper); border: 4px solid var(--terra); border-radius: 999px; padding: 4px 38px 12px;
  font-weight: 800; font-size: 52px; color: var(--ink); box-shadow: 0 10px 0 rgba(120,70,30,.28); }
.chip.t { border-color: var(--teal); }
.plate { display: inline-block; background: var(--teal); color: var(--cream); border-radius: 16px; padding: 6px 40px 14px; font-weight: 800; font-size: 56px; box-shadow: 0 10px 0 rgba(6,40,44,.4); }
.plate small { display: block; font-size: 34px; font-weight: 600; color: #bfe0dc; margin-top: -8px; }
.mc { width: 130px; height: 176px; border-radius: 14px; background: var(--paper); border: 5px solid var(--terra); text-align: center; box-shadow: 0 12px 0 rgba(120,70,30,.28); }
.mc b { display: block; margin-top: 18px; font-family: "Reem Kufi"; font-size: 44px; color: var(--terra); }
.mc i { display: block; font-style: normal; font-family: "Amiri"; font-weight: 700; font-size: 34px; margin-top: 14px; color: var(--ink); }
.glow { border-radius: 50%; }
#cap { position: absolute; left: 110px; right: 110px; bottom: 600px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
#cap .ar { font-weight: 800; font-size: 54px; line-height: 1.45; color: var(--cream); text-shadow: 0 2px 10px rgba(0,30,34,.9); }
#cap .zh { font-family: "Noto Sans SC", "Cairo", sans-serif; font-weight: 700; font-size: 42px; line-height: 1.4; color: #ffd37a; direction: ltr; text-shadow: 0 2px 10px rgba(0,30,34,.9); }
#cap .en { font-weight: 600; font-size: 35px; line-height: 1.35; color: #cfe6e2; direction: ltr; text-shadow: 0 2px 10px rgba(0,30,34,.9); }
</style>
</head>
