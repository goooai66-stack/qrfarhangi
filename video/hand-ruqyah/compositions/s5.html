  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const S = 25.7; // scene start in film seconds; every time below is written in film seconds
      const at = (t) => t - S;

      function lit(sel, dur) {
        gsap.utils.toArray(sel + " .w").forEach((el) => {

            { opacity: 1, filter: "blur(0px)", duration: dur || 0.16, ease: "power2.out" }, at(parseFloat(el.getAttribute("data-t"))));

      }
      function hit(sel) {
        gsap.utils.toArray(sel).forEach((el) => {
          const t = at(parseFloat(el.getAttribute("data-t")));
          tl.fromTo(el, { color: "#f4ecd8", scale: 1.0 }, { color: "#d4a94f", scale: 1.14, duration: 0.14, ease: "power2.out" }, t);
          tl.to(el, { scale: 1, duration: 0.4, ease: "expo.out" }, t + 0.14);
        });
      }
      function blurOut(sel, t, d) { tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: d || 0.2, ease: "power3.in" }, t); }
      function pop(sel, t) { tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.4)" }, t); }
      function draw(sel, t, d, e) {
        tl.fromTo(sel, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: d, ease: e || "power2.inOut" }, t);
      }
      function whipIn(stage) {
        tl.fromTo(stage, { x: -620, filter: "blur(16px)", opacity: 0.4 }, { x: 0, filter: "blur(0px)", opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
      }
      function ripple(sel, t, r0, r1, d) {
        tl.fromTo(sel, { attr: { r: r0, "stroke-opacity": 0.75 } }, { attr: { r: r1, "stroke-opacity": 0 }, duration: d || 1.1, ease: "power2.out", immediateRender: false }, t);
      }

      tl.fromTo("#s5-stage", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, at(25.85));
      // لماذا؟ lands big, the rest of the question lights under it
      tl.fromTo("#s5-why", { opacity: 0, scale: 1.5, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, at(25.81));
      lit("#s5-why2", 0.16); hit("#s5-why2 .k");
      blurOut(["#s5-why", "#s5-why2"], at(27.85), 0.22);
      // لأنك حين تقف بين يدي الله: the arch draws while it is said, the vessel stands in it
      draw("#s5-arch", at(28.07), 1.7, "power2.inOut");
      tl.to("#s5-floor", { opacity: 1, duration: 0.4 }, at(28.07));
      tl.fromTo("#s5-vessel", { opacity: 0, attr: { r: 60 } }, { opacity: 1, attr: { r: 100 }, duration: 0.5, ease: "expo.out" }, at(30.02));
      // متألمًا: the vessel aches (amber glow, three beats)
      tl.fromTo("#s5-pain", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, at(30.49));
      [0, 1, 2].forEach((i) => {
        tl.fromTo("#s5-pain", { scale: 1 }, { scale: 1.16, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, at(30.94 + i * 0.42));
        tl.fromTo("#s5-vessel", { attr: { r: 100 } }, { attr: { r: 110 }, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, at(30.94 + i * 0.42));
      });
      // منكسرًا: it breaks, and the light comes out through the cracks
      gsap.utils.toArray(".crk").forEach((el, i) => draw(el, at(31.16) + i * 0.06, 0.2, "power3.out"));
      tl.to("#s5-pain", { opacity: 0, duration: 0.3 }, at(31.16));
      tl.fromTo("#s5-light", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, at(31.26));
      tl.fromTo("#s5-rays", { opacity: 0, scale: 0.6, rotation: 0 }, { opacity: 0.9, scale: 1.1, duration: 0.55, ease: "expo.out" }, at(31.26));
      tl.to("#s5-rays", { opacity: 0.3, duration: 0.8, ease: "power2.inOut" }, at(31.86));
      tl.to("#s5-rays", { rotation: 24, duration: 3.6, ease: "none" }, at(31.26));
      tl.fromTo("#s5-mih", { x: 0 }, { x: 8, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, at(31.16));
      // أصدق حالات الافتقار: the meter fills

      tl.to(["#s5-track", "#s5-fill"], { opacity: 1, duration: 0.3 }, at(32.05));

      blurOut("#s5-stage", at(34.72), 0.2);
      window.__timelines["s5"] = tl;
