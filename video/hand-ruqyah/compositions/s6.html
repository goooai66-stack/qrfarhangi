<template>
  <style>
    @font-face { font-family: "Cairo"; src: url("assets/fonts/Cairo.ttf") format("truetype"); font-weight: 200 1000; }
    @font-face { font-family: "Reem Kufi"; src: url("assets/fonts/ReemKufi.ttf") format("truetype"); font-weight: 400 700; }
    @font-face { font-family: "Amiri"; src: url("assets/fonts/Amiri-Regular.woff") format("woff"); font-weight: 400; }
    @font-face { font-family: "Amiri"; src: url("assets/fonts/Amiri-Bold.woff") format("woff"); font-weight: 700; }
    #root { position: absolute; inset: 0; direction: rtl; color: #f4ecd8; font-family: "Cairo", sans-serif; }
    #root .stage { position: absolute; inset: 0; }
    #root .line { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
    #root .abs { position: absolute; }
    #root .w { display: inline-block; }
    #root .k { color: #d4a94f; }
    #root .gold { color: #d4a94f; }
    #root .amiri { font-family: "Amiri", serif; font-weight: 700; }
    #root .kufi { font-family: "Reem Kufi", sans-serif; font-weight: 700; }
    #root .chip { display: inline-block; border: 3px solid #d4a94f; border-radius: 999px; padding: 4px 34px 10px;
      font-weight: 800; font-size: 46px; color: #f4ecd8; background: rgba(5, 18, 26, .6); white-space: nowrap; }
    #root svg { overflow: visible; display: block; }
  </style>
  <div id="root" data-composition-id="s6" data-width="1080" data-height="1920">
    <div id="s6-stage" class="stage">

      <div id="s6-graph" class="abs" style="inset: 0">
        <div id="s6-ylab" class="abs" style="right: 150px; top: 250px; font-size: 52px; font-weight: 800; white-space: nowrap">القرب من الإجابة</div>
        <svg class="abs" style="left: 0; top: 0" width="1080" height="1920" viewBox="0 0 1080 1920" aria-hidden="true">
          <line id="s6-ax1" x1="930" y1="330" x2="930" y2="960" stroke="#f4ecd8" stroke-opacity=".45" stroke-width="5"/>
          <line id="s6-ax2" x1="150" y1="960" x2="930" y2="960" stroke="#f4ecd8" stroke-opacity=".45" stroke-width="5"/>
          <path id="s6-curve" d="M930,960 C780,950 520,880 260,400" fill="none" stroke="#d4a94f" stroke-width="12" stroke-linecap="butt" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
          <circle id="s6-dot" cx="930" cy="960" r="24" fill="#f6d98a"/>
        </svg>
        <svg id="s6-star" class="abs" style="left: 160px; top: 300px" width="200" height="200" viewBox="-100 -100 200 200" aria-hidden="true">
          <polygon points="0.0,-96.0 16.8,-40.7 67.9,-67.9 40.7,-16.8 96.0,0.0 40.7,16.8 67.9,67.9 16.8,40.7 0.0,96.0 -16.8,40.7 -67.9,67.9 -40.7,16.8 -96.0,0.0 -40.7,-16.8 -67.9,-67.9 -16.8,-40.7" fill="#f6d98a"/>
        </svg>
        <div id="s6-xlab" class="abs" style="right: 150px; top: 990px; font-size: 52px; font-weight: 800; white-space: nowrap">الانكسار والافتقار</div>
        <div id="s6-ans" class="abs" style="left: 90px; top: 180px; width: 340px; text-align: center"><span class="chip amiri" style="font-size: 64px">الإجابة</span></div>
      </div>
      <svg id="s6-beamsvg" class="abs" style="left: 0; top: 0" width="1080" height="1920" viewBox="0 0 1080 1920" aria-hidden="true">
        <defs><linearGradient id="s6-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d98a" stop-opacity="0"/><stop offset="1" stop-color="#f6d98a" stop-opacity=".75"/></linearGradient></defs>
        <polygon id="s6-beam" points="390,200 690,200 540,520 540,520" fill="url(#s6-bg)" opacity="0"/>
        <line id="s6-ground" x1="150" y1="900" x2="930" y2="900" stroke="#f4ecd8" stroke-opacity=".6" stroke-width="6" opacity="0"/>
        <circle class="s6-rp" cx="540" cy="900" r="30" fill="none" stroke="#f6d98a" stroke-width="7" stroke-opacity="0"/>
        <circle class="s6-rp" cx="540" cy="900" r="30" fill="none" stroke="#f6d98a" stroke-width="7" stroke-opacity="0"/>
        <circle id="s6-dot2" cx="540" cy="520" r="34" fill="#f6d98a" opacity="0"/>
      </svg>
      <div id="s6-rab" class="line" style="top: 168px"><span class="chip amiri" style="font-size: 54px">ربِّه</span></div>
      <div id="s6-abd" class="abs" style="left: 600px; top: 480px"><span class="chip" style="font-size: 46px">العبد</span></div>
      <div id="s6-sajid" class="line amiri gold" style="top: 915px; font-size: 100px; line-height: 1.2">ساجد</div>
      <div id="s6-eq" class="line" style="top: 1062px; display: flex; justify-content: center; align-items: center; gap: 26px">
        <span id="s6-e1" class="chip amiri" style="font-size: 60px">السجود</span><span id="s6-e2" class="kufi gold" style="font-size: 80px; line-height: 1">=</span><span id="s6-e3" class="chip amiri" style="font-size: 60px">انكسار</span>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const S = 34.8; // scene start in film seconds; every time below is written in film seconds
      const at = (t) => t - S;

      function lit(sel, dur) {
        gsap.utils.toArray(sel + " .w").forEach((el) => {
          tl.fromTo(el, { opacity: 0, filter: "blur(8px)" },
            { opacity: 1, filter: "blur(0px)", duration: dur || 0.16, ease: "power2.out" }, at(parseFloat(el.getAttribute("data-t"))));
        });
      }
      function hit(sel) {
        gsap.utils.toArray(sel).forEach((el) => {
          const t = at(parseFloat(el.getAttribute("data-t")));
          tl.fromTo(el, { color: "#f4ecd8", scale: 1.0 }, { color: "#d4a94f", scale: 1.14, duration: 0.14, ease: "power2.out" }, t);
          tl.to(el, { scale: 1, duration: 0.4, ease: "expo.out" }, t + 0.14);
        });
      }
      function blurOut(sel, t, d) { tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: d || 0.2, ease: "power3.in" }, t); }
      function pop(sel, t) { tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.4)" }, t); }
      function draw(sel, t, d, e) {
        tl.fromTo(sel, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: d, ease: e || "power2.inOut" }, t);
      }
      function whipIn(stage) {
        tl.fromTo(stage, { x: -620, filter: "blur(16px)", opacity: 0.4 }, { x: 0, filter: "blur(0px)", opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
      }
      function ripple(sel, t, r0, r1, d) {
        tl.fromTo(sel, { attr: { r: r0, "stroke-opacity": 0.75 } }, { attr: { r: r1, "stroke-opacity": 0 }, duration: d || 1.1, ease: "power2.out", immediateRender: false }, t);
      }

      tl.fromTo("#s6-stage", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, at(35.0));
      // the two axes: انكسار وافتقار along, القرب من الإجابة up
      tl.fromTo(["#s6-ax1", "#s6-ax2"], { opacity: 0 }, { opacity: 1, duration: 0.3 }, at(35.56));
      tl.fromTo("#s6-xlab", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, at(36.51));
      tl.fromTo("#s6-ylab", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, at(38.18));
      // the curve climbs, the dot rides the front
      // the dot rides the same cubic the stroke is drawn along: sample it once, walk it by arc length
      const B = [[930, 960], [780, 950], [520, 880], [260, 400]], dot = document.getElementById("s6-dot"), pts = [], cum = [0];
      for (let i = 0; i <= 240; i++) { const u = i / 240, m = 1 - u;
        pts.push([0, 1].map((k) => m * m * m * B[0][k] + 3 * m * m * u * B[1][k] + 3 * m * u * u * B[2][k] + u * u * u * B[3][k]));
        if (i) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); }
      const prog = { p: 0 };
      function place() { const d = prog.p * cum[240]; let i = 1; while (i < 240 && cum[i] < d) i++;
        const f = (d - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1), a = pts[i - 1], b = pts[i];
        dot.setAttribute("cx", a[0] + (b[0] - a[0]) * f); dot.setAttribute("cy", a[1] + (b[1] - a[1]) * f); }
      place();
      tl.to(prog, { p: 1, duration: 2.17, ease: "power2.inOut", onUpdate: place }, at(36.51));
      draw("#s6-curve", at(36.51), 2.17, "power2.inOut");
      // الإجابة: the star
      tl.fromTo("#s6-star", { opacity: 0, scale: 0.2, rotation: -30 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.55, ease: "back.out(1.8)" }, at(38.83));
      pop("#s6-ans", at(38.98));
      blurOut("#s6-graph", at(39.62), 0.22);
      // the beam: العبد below, ربه above, the light between them
      pop("#s6-abd", at(41.30));
      tl.fromTo("#s6-dot2", { opacity: 0, attr: { r: 10 } }, { opacity: 1, attr: { r: 34 }, duration: 0.45, ease: "back.out(1.6)" }, at(41.30));
      pop("#s6-rab", at(41.98));
      tl.fromTo("#s6-ground", { opacity: 0 }, { opacity: 1, duration: 0.4 }, at(39.83));
      const beam = document.getElementById("s6-beam"), dot2 = document.getElementById("s6-dot2");
      const sj = { p: 0 };
      function lower() {
        const y = 520 + 346 * sj.p, w = 28 + 120 * (1 - sj.p);
        dot2.setAttribute("cy", y);
        beam.setAttribute("points", `390,200 690,200 ${540 + w},${y - 34} ${540 - w},${y - 34}`);
      }
      tl.fromTo("#s6-beam", { opacity: 0 }, { opacity: 0.35, duration: 0.6 }, at(39.83));
      // وهو ساجد: the dot goes down, the beam narrows and brightens
      tl.to(sj, { p: 1, duration: 0.65, ease: "power2.inOut", onUpdate: lower }, at(42.55));
      tl.to("#s6-beam", { opacity: 1, duration: 0.65, ease: "power2.inOut" }, at(42.55));
      tl.to("#s6-abd", { y: 346, duration: 0.65, ease: "power2.inOut" }, at(42.55));
      // touch: ripples, flare, the word
      gsap.utils.toArray(".s6-rp").forEach((el, i) => ripple(el, at(43.2 + i * 0.16), 30, 300 - i * 70, 0.9));
      tl.fromTo("#s6-sajid", { opacity: 0, scale: 1.4, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, at(43.2));
      tl.fromTo("#s6-beamsvg", { y: 0 }, { y: 12, duration: 0.06, yoyo: true, repeat: 3, ease: "none" }, at(43.2));
      // السجود = انكسار
      pop("#s6-e1", at(44.07)); tl.fromTo("#s6-e2", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, at(44.37));
      pop("#s6-e3", at(44.68));
      window.__timelines["s6"] = tl;
    })();
  </script>
</template>
