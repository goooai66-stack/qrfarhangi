        <div class="amiri gold" style="font-size: 140px; line-height: 1.2"><span class="w" data-t="45.72">ابدأ</span> <span class="w" data-t="46.11">من</span> <span class="w" data-t="46.33">اليوم</span></div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const S = 45.25; // scene start in film seconds; every time below is written in film seconds
      const at = (t) => t - S;

      function lit(sel, dur) {
        gsap.utils.toArray(sel + " .w").forEach((el) => {
          tl.fromTo(el, { opacity: 0, filter: "blur(8px)" },
            { opacity: 1, filter: "blur(0px)", duration: dur || 0.16, ease: "power2.out" }, at(parseFloat(el.getAttribute("data-t"))));
        });
      }
      function hit(sel) {
        gsap.utils.toArray(sel).forEach((el) => {
          const t = at(parseFloat(el.getAttribute("data-t")));
          tl.fromTo(el, { color: "#f4ecd8", scale: 1.0 }, { color: "#d4a94f", scale: 1.14, duration: 0.14, ease: "power2.out" }, t);
          tl.to(el, { scale: 1, duration: 0.4, ease: "expo.out" }, t + 0.14);
        });
      }
      function blurOut(sel, t, d) { tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: d || 0.2, ease: "power3.in" }, t); }
      function pop(sel, t) { tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.4)" }, t); }
      function draw(sel, t, d, e) {
        tl.fromTo(sel, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: d, ease: e || "power2.inOut" }, t);
      }
      function whipIn(stage) {
        tl.fromTo(stage, { x: -620, filter: "blur(16px)", opacity: 0.4 }, { x: 0, filter: "blur(0px)", opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
      }
      function ripple(sel, t, r0, r1, d) {
        tl.fromTo(sel, { attr: { r: r0, "stroke-opacity": 0.75 } }, { attr: { r: r1, "stroke-opacity": 0 }, duration: d || 1.1, ease: "power2.out", immediateRender: false }, t);
      }

      // the flare from the sujood dissolves into the lamp's room
      tl.fromTo("#s7-flare", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.in" }, at(45.25));
      tl.to("#s7-flare", { opacity: 0, duration: 0.7, ease: "power2.out" }, at(45.58));
      tl.fromTo("#s7-lamp", { y: -120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, at(45.6));
      tl.fromTo("#s7-glow", { opacity: 0.2 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, at(45.7));
      // ابدأ: the flame lights
      tl.fromTo("#s7-flame", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.8)", transformOrigin: "50% 100%" }, at(45.72));
      lit("#s7-start", 0.18);
      blurOut("#s7-start", at(47.45), 0.2);
      // شارك: the arrow leaves the tray, rings go out
      draw("#s7-box", at(47.6), 0.5, "power2.out");
      draw("#s7-up", at(47.85), 0.4, "power2.out");
      draw("#s7-uph", at(48.2), 0.18, "power2.out");
      gsap.utils.toArray(".s7-rp").forEach((el, i) => ripple(el, at(48.35 + i * 0.22), 20, 90 + i * 14, 0.9));
      tl.fromTo("#s7-shlab", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, at(48.0));
      // the name, held
      blurOut(["#s7-share", "#s7-shlab"], at(49.95), 0.2);
      tl.fromTo("#s7-name", { opacity: 0, filter: "blur(12px)", scale: 1.06 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.7, ease: "expo.out" }, at(50.12));
      tl.fromTo("#s7-tag", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, at(50.45));
      window.__timelines["s7"] = tl;
    })();
  </script>
