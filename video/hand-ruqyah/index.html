    <script>
      const tl = gsap.timeline({ paused: true });
      // slow drift of the emerald light and the gold dust, once over the whole film
      tl.to("#b1", { x: 160, y: -120, duration: 52.7, ease: "sine.inOut" }, 0);
      tl.to("#b2", { x: -200, y: -160, duration: 52.7, ease: "sine.inOut" }, 0);
      tl.to("#b3", { x: 220, y: -200, duration: 52.7, ease: "sine.inOut" }, 0);
      const dist = [524, 1490, 1108, 812, 1469, 791, 949, 1023, 1391, 952, 1196, 1081, 520, 1090, 578, 897, 838, 1428, 1494, 882, 1172, 772, 1112, 1380, 612, 858, 864, 649, 626, 956, 1215, 1429, 647, 669, 549, 1004, 1090, 801, 851, 865, 1470, 594, 1403, 1429, 1179, 762, 1291, 1308, 640, 677, 837, 936, 1213, 524, 984, 1102];
      gsap.utils.toArray(".dust").forEach((el, i) => tl.to(el, { y: -dist[i], duration: 52.7, ease: "none" }, 0));
      // pain is warm: it beats with the orb, softens under the hadith, goes out when the name is said
      tl.set("#pain", { opacity: 0.85 }, 0);
      [0.25, 1.15, 2.05, 2.95].forEach((b) => { tl.to("#pain", { opacity: 1, duration: 0.2, ease: "power2.out" }, b); tl.to("#pain", { opacity: 0.8, duration: 0.7, ease: "power2.inOut" }, b + 0.2); });
      tl.to("#pain", { opacity: 0.45, duration: 0.8, ease: "power2.inOut" }, 3.9);
      tl.to("#pain", { opacity: 0.32, duration: 0.6 }, 6.6);
      tl.to("#pain", { opacity: 0.7, duration: 0.25, ease: "power2.out" }, 11.5);
      tl.to("#pain", { opacity: 0.4, duration: 0.8 }, 11.75);
      tl.to("#pain", { opacity: 0.8, duration: 0.8, ease: "power2.in" }, 15.3);
      tl.to("#pain", { opacity: 1, duration: 0.15, ease: "power2.out" }, 16.42);
      tl.to("#pain", { opacity: 0.35, duration: 1.3, ease: "power2.inOut" }, 16.6);
      tl.to("#pain", { opacity: 0, duration: 0.7, ease: "power2.inOut" }, 18.3);
      // gold is what heals: wash at «بسم الله», at the cracks, at the star, at the touch
      const wash = (t, peak, hold) => { tl.to("#goldwash", { opacity: peak, duration: 0.25, ease: "power2.out" }, t); tl.to("#goldwash", { opacity: hold, duration: 1.0, ease: "power2.inOut" }, t + 0.25); };
      wash(18.3, 0.55, 0.3);
      tl.to("#goldwash", { opacity: 0, duration: 1.0, ease: "power2.inOut" }, 20.0);
      wash(31.0, 0.5, 0.1);
      wash(39.3, 0.35, 0.05);
      wash(43.2, 0.7, 0.12);
      tl.to("#goldwash", { opacity: 0, duration: 1.0 }, 45.9);
      window.__timelines["main"] = tl;
    </script>
