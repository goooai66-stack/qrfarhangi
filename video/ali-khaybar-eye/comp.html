ured him,", "zh": "是真主赐予他的恩典,"}, {"a": 29.96, "b": 31.32, "ar": "ولا يُفعل مثلها مع المرضى", "en": "and the like of it is not done with patients.", "zh": "不能照此对待病人。"}, {"a": 31.61, "b": 32.31, "ar": "ولكن العبرة", "en": "But the lesson", "zh": "但其中的教益"}, {"a": 32.53, "b": 34.73, "ar": "أنه دعا لعليّ وهو يتألم", "en": "is that he made du‘a for ‘Ali while he was in pain", "zh": "是他在阿里痛苦时为他祈祷,"}, {"a": 35.05, "b": 36.01, "ar": "ولم يتركه مريضًا", "en": "and did not leave him ill.", "zh": "没有让他一直病着。"}, {"a": 36.82, "b": 40.02, "ar": "علّمنا النبي صلى الله عليه وسلم أن المريض لا يُترك", "en": "The Prophet (peace be upon him) taught us that a patient is not to be left alone:", "zh": "先知(愿主福安之)教导我们:不应让病人听之任之,"}, {"a": 40.22, "b": 40.83, "ar": "بل يُدعى له", "en": "du‘a is made for him,", "zh": "而要为他祈祷,"}, {"a": 41.1, "b": 41.76, "ar": "ويُعالج", "en": "he is treated,", "zh": "为他治疗,"}, {"a": 41.99, "b": 43.22, "ar": "ويُستشفى له من الله", "en": "and healing is sought for him from Allah.", "zh": "并向真主为他求取康复。"}, {"a": 43.88, "b": 46.76, "ar": "شارك هذه القصة مع من تحب، وتابع القناة", "en": "Share this story with someone you love, and follow the channel.", "zh": "把这个故事分享给你爱的人,并关注本频道。"}];

  for (const b of BURSTS) out.push([b.t, "thump", .26]); for (const sc of SCN) if (sc.b < 70) out.push([sc.b - 0.4, "erase", .3]); return out.sort((p, q) => p[0] - q[0]); })();
window.render = render;

  await document.fonts.ready; render(0); return true;
})();
