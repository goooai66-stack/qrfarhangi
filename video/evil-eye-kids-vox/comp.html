<script>
const W = 1920, H = 1080, DUR = 498.04, CAPS = [{"a": 0.03, "b": 2.57, "ar": "حدّثتني أمٌّ عن يومٍ لن تنساه.", "en": "A mother told me about a day she will never forget.", "zh": "一位母亲向我讲述了她永远不会忘记的一天。"}, {"a": 2.66, "b": 9.13, "ar": "كانت في زيارةٍ عند بعض الناس، وحين همّت بالقيام والانصراف مرّ بقلبها خاطرٌ سريع:", "en": "She was visiting some people, and as she got up to leave, a quick thought crossed her heart:", "zh": "她当时在别人家做客,起身告辞时,心里闪过一个念头:"}, {"a": 9.22, "b": 11.54, "ar": "أخشى أن يصاب طفلي بالعين.", "en": "“I fear my child may be struck by the evil eye.”", "zh": "“我担心我的孩子会中邪眼。”"}, {"a": 11.63, "b": 18.31, "ar": "خرجت وركبت السيارة، ولم تمضِ إلا دقائق حتى تقيّأ الصغير مرتين متتاليتين.", "en": "She left and got into the car, and within minutes the little one vomited twice in a row.", "zh": "她出门上了车,才过了几分钟,孩子就连续吐了两次。"}, {"a": 18.4, "b": 21.57, "ar": "ومنذ ذلك اليوم.. تغيّر كل شيء.", "en": "And from that day on... everything changed.", "zh": "从那天起……一切都变了。"}, {"a": 21.66, "b": 24.78, "ar": "بكاءٌ لا يهدأ، ولا نومَ في نهارٍ ولا في ليل،", "en": "Crying that would not settle, no sleep by day or by night,", "zh": "哭闹不止,白天夜里都不睡,"}, {"a": 24.87, "b": 26.63, "ar": "خمسة أشهرٍ أو ستة،", "en": "for five or six months,", "zh": "持续了五六个月,"}, {"a": 26.72, "b": 29.36, "ar": "وكلّ ما جرّبوه لم يُجْدِ شيئًا.", "en": "and nothing they tried made any difference.", "zh": "他们试过的办法都没有用。"}, {"a": 29.45, "b": 38.1, "ar": "ثم بدأنا معه بالرقية الشرعية، وأوصينا أمَّه بالإكثار من الاستغفار، وأن تقرأ عليه صباحًا ومساءً سورًا وأدعية،", "en": "Then we began sharʿī ruqyah with him, and advised his mother to make much istighfar and to recite over him morning and evening,", "zh": "后来我们为他开始了合乎教法的诵经祛病,并嘱咐他的母亲多求饶恕,早晚为他诵读,"}, {"a": 38.19, "b": 40.32, "ar": "والشفاء بيد الله وحده.", "en": "and healing is in Allah’s hand alone.", "zh": "而治愈只掌握在真主手中。"}, {"a": 40.41, "b": 43.03, "ar": "وربما مررتِ أنتِ أيضًا بشيءٍ مثله؟", "en": "Perhaps you, too, have been through something like it?", "zh": "也许你也经历过类似的事?"}, {"a": 43.12, "b": 52.58, "ar": "في هذه الحلقة نقف مع ما جاء في الكتاب والسنة عن العين التي تصيب الصغار، وكيف نعالجها ونقي أطفالنا منها بالطريقة الشرعية،", "en": "In this episode we look at what the Qur’an and Sunnah say about the evil eye that strikes little ones, and how to treat it and protect our children in the lawful way,", "zh": "本期我们来看《古兰经》和圣训中关于伤害幼儿的邪眼的教导,以及如何以合乎教法的方式治疗并保护孩子,"}, {"a": 52.67, "b": 57.86, "ar": "وفي آخرها برنامجٌ يوميٌّ متكامل يمكنك أن تبدأ به من الليلة.", "en": "and at the end, a complete daily plan you can start tonight.", "zh": "最后还有一套完整的每日方案,你今晚就可以开始。"}, {"a": 57.95, "b": 60.34, "ar": "العينُ.. حقيقةٌ أم وهم؟", "en": "The evil eye... reality or illusion?", "zh": "邪眼……是真实还是幻觉?"}, {"a": 60.43, "b": 63.83, "ar": "قال رسول الله ﷺ: «العين حق».", "en": "The Messenger of Allah (peace be upon him) said: “The evil eye is real.”", "zh": "真主的使者(愿主福安之)说:“邪眼是真实的。”"}, {"a": 63.92, "b": 69.67, "ar": "وفي رواية أخرى: «العين حق، ولو كان شيءٌ سابق القدر لسبقته العين».", "en": "In another report: “The evil eye is real, and if anything could outrun destiny, the eye would.”", "zh": "另一传述:“邪眼是真实的;若有什么能超越前定,那便是邪眼。”"}, {"a": 69.76, "b": 78.03, "ar": "وذكر كثير من المفسرين أن قول الله تعالى: ﴿وَإِن يَكَادُ الَّذِينَ كَفَرُوا لَيُزْلِقُونَكَ بِأَبْصَارِهِمْ﴾ نزل في شأن العين.", "en": "Many commentators mention that the words of Allah, “And those who disbelieve would almost make you slip with their eyes,” were revealed about the evil eye.", "zh": "许多注释家提到,真主的话“不信道者几乎要用他们的眼光使你跌倒”,就是针对邪眼而降示的。"}, {"a": 78.12, "b": 82.8, "ar": "لكن تذكّر دائمًا: العين لا تؤثّر إلا بإذن الله.", "en": "But always remember: the eye only affects by Allah’s permission.", "zh": "但请永远记住:邪眼只有经真主允许才会起作用。"}, {"a": 82.89, "b": 88.41, "ar": "فليس لنظرة أحدٍ قوةٌ مستقلة، ولسنا بلا حماية؛ فالله هو الحافظ.", "en": "No one’s glance has independent power, and we are not unprotected, for Allah is the Protector.", "zh": "任何人的目光都没有独立的力量,我们也并非没有保护,因为真主是保护者。"}, {"a": 88.5, "b": 91.62, "ar": "ولماذا يتأثر الأطفال أسرع من غيرهم؟", "en": "And why are children affected faster than others?", "zh": "为什么孩子比别人更容易受影响?"}, {"a": 91.71, "b": 96.21, "ar": "جاءت أسماء بنت عُميس إلى النبي ﷺ فقالت:", "en": "Asmāʾ bint ʿUmays came to the Prophet (peace be upon him) and said:", "zh": "艾斯玛·宾特·欧迈斯来到先知(愿主福安之)面前,说:"}, {"a": 96.3, "b": 101.6, "ar": "يا رسول الله، إن ولد جعفر تسرع إليهم العين، أفأسترقي لهم؟", "en": "“O Messenger of Allah, the eye is quick to reach Jaʿfar’s children. Shall I seek ruqyah for them?”", "zh": "“真主的使者啊,邪眼很容易伤到贾法尔的孩子,我可以为他们诵经祛病吗?”"}, {"a": 101.69, "b": 106.88, "ar": "فقال: «نعم، فإنه لو كان شيءٌ سابق القدر لسبقته العين».", "en": "He said: “Yes, for if anything could outrun destiny, the eye would.”", "zh": "他说:“可以,因为若有什么能超越前定,那便是邪眼。”"}, {"a": 106.97, "b": 114.16, "ar": "ورأى ﷺ في بيت أم سلمة جاريةً في وجهها سَفْعة، أي تغيّرٌ في لونها،", "en": "And in the house of Umm Salama he saw a girl with a safʿa on her face, a change in her colour,", "zh": "他(愿主福安之)在乌姆·塞莱麦家中见到一个女孩,脸上有“萨夫阿”,也就是肤色发生了变化,"}, {"a": 114.25, "b": 117.57, "ar": "فقال: «استرقوا لها، فإن بها النظرة».", "en": "and said: “Seek ruqyah for her, for she has been struck by the eye.”", "zh": "于是说:“为她诵经祛病吧,她被邪眼伤到了。”"}, {"a": 117.66, "b": 123.75, "ar": "الطفل جميل، تتعلق به الأنظار، ويُثنى عليه، وتتناقل الهواتف صورته،", "en": "A child is lovely; eyes cling to him, he is praised, and phones pass his picture around,", "zh": "孩子惹人喜爱,目光都被他吸引,人们称赞他,手机里到处传着他的照片,"}, {"a": 123.84, "b": 127.45, "ar": "وهو لا يملك أن يذكر الله على نفسه أو يحصّنها.", "en": "while he cannot mention Allah over himself or protect himself.", "zh": "而他自己无法诵念真主之名,也无法保护自己。"}, {"a": 127.54, "b": 130.42, "ar": "فتحصينه أمانةٌ في عنق الوالدين.", "en": "So protecting him is a trust upon the parents’ necks.", "zh": "因此保护他是父母肩上的一项责任。"}, {"a": 130.51, "b": 132.37, "ar": "علاماتٌ يذكرها الرقاة", "en": "Signs that those who practise ruqyah mention", "zh": "诵经者常提到的迹象"}, {"a": 132.46, "b": 139.3, "ar": "يذكر أهل الخبرة بالرقية علاماتٍ تظهر في الغالب فجأة، بعد زيارةٍ أو مديحٍ أو نظرة:", "en": "Experienced practitioners mention signs that usually appear suddenly, after a visit, a compliment or a glance:", "zh": "有经验的诵经者提到一些通常突然出现的迹象,多在做客、被夸赞或被注视之后:"}, {"a": 139.39, "b": 141.93, "ar": "بكاءٌ طويل بلا سببٍ ظاهر،", "en": "long crying with no apparent cause,", "zh": "无明显原因的长时间啼哭,"}, {"a": 142.02, "b": 143.87, "ar": "وسهرٌ في الليل والنهار،", "en": "sleeplessness night and day,", "zh": "日夜不眠,"}, {"a": 143.96, "b": 145.65, "ar": "وإعراضٌ عن الرضاعة،", "en": "refusing to feed,", "zh": "拒绝吃奶,"}, {"a": 145.74, "b": 148.29, "ar": "وقلقٌ حتى وهو في حضن أمه،", "en": "restlessness even in his mother’s arms,", "zh": "即使在母亲怀里也烦躁不安,"}, {"a": 148.38, "b": 150.29, "ar": "وفزعٌ مفاجئ من النوم.", "en": "and sudden fright from sleep.", "zh": "以及从睡梦中突然惊醒。"}, {"a": 150.38, "b": 153.25, "ar": "غير أن هذه العلامات ليست قطعية،", "en": "Yet these signs are not conclusive,", "zh": "不过这些迹象并不是定论,"}, {"a": 153.34, "b": 155.06, "ar": "فليس كل بكاءٍ عينًا،", "en": "for not every cry is the eye,", "zh": "因为并非每次哭闹都是邪眼,"}, {"a": 155.16, "b": 159.3, "ar": "فلا ننسب كل شيء إلى العين، ولا نتهم أحدًا بغير بيّنة.", "en": "so we do not blame everything on the eye, nor accuse anyone without proof.", "zh": "所以我们不要把一切都归咎于邪眼,也不要在没有证据时指责任何人。"}, {"a": 159.39, "b": 169.13, "ar": "والجميل في الرقية الشرعية أنها إن كانت عينًا فهي بإذن الله شفاء، وإن لم تكن فهي ذكرٌ ودعاءٌ وبركة، لا ضرر فيها.", "en": "The beauty of sharʿī ruqyah is that if it is the eye, then by Allah’s leave it is a cure, and if not, it is remembrance, prayer and blessing, with no harm in it.", "zh": "合乎教法的诵经祛病的美好在于:若是邪眼,则凭真主的许可就是治疗;若不是,那也是赞念、祈祷与吉祥,毫无害处。"}, {"a": 169.22, "b": 172.13, "ar": "والآن، العلاج خطوةً خطوة.", "en": "And now, the treatment, step by step.", "zh": "现在,一步一步来看治疗方法。"}, {"a": 172.22, "b": 175.06, "ar": "الخطوة الأولى: اليقين والتوكل.", "en": "Step one: certainty and reliance on Allah.", "zh": "第一步:笃信与托靠真主。"}, {"a": 175.15, "b": 180.57, "ar": "قال تعالى: ﴿وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِّلْمُؤْمِنِينَ﴾", "en": "Allah says: “And We send down of the Qur’an that which is healing and mercy for the believers.”", "zh": "真主说:“我降示《古兰经》,对于信士们,是治疗,是恩惠。”"}, {"a": 180.66, "b": 186.72, "ar": "اقرأ وأنتِ موقنةٌ أن الشافي هو الله وحده، لا أنتِ ولا كلماتك.", "en": "Recite while certain that the Healer is Allah alone, not you and not your words.", "zh": "诵读时要笃信:治愈者唯有真主,不是你,也不是你的言语。"}, {"a": 187.57, "b": 190.72, "ar": "الخطوة الثانية: القراءة على الطفل.", "en": "Step two: reciting over the child.", "zh": "第二步:为孩子诵读。"}, {"a": 190.81, "b": 198.12, "ar": "أخبرت عائشة رضي الله عنها أن النبي ﷺ كان إذا اشتكى قرأ على نفسه بالمعوذات ونفث.", "en": "ʿĀʾisha (may Allah be pleased with her) reported that when the Prophet (peace be upon him) fell ill, he would recite the Muʿawwidhāt over himself and blow lightly.", "zh": "阿伊莎(愿主喜悦她)转述:先知(愿主福安之)患病时,会为自己诵读护佑三章并轻轻吹气。"}, {"a": 198.21, "b": 201.61, "ar": "فاجلسي قرب طفلك متوضئة،", "en": "Sit near your child in a state of wudūʾ,", "zh": "在孩子身边坐下,保持洁净,"}, {"a": 201.7, "b": 204.89, "ar": "وضعي يدك اليمنى برفق على رأسه أو صدره،", "en": "place your right hand gently on his head or chest,", "zh": "把右手轻轻放在他的头上或胸口,"}, {"a": 204.98, "b": 208.84, "ar": "واقرئي وانفثي عليه نفثًا خفيفًا بعد كل سورة.", "en": "and recite, blowing lightly over him after each sura.", "zh": "边诵读边轻轻地向他吹气,每读完一章吹一次。"}, {"a": 208.93, "b": 210.54, "ar": "وفي كل صباحٍ ومساء:", "en": "Every morning and evening:", "zh": "每天早晚:"}, {"a": 210.63, "b": 215.59, "ar": "الفاتحة سبع مرات، وآية الكرسي، وخواتيم سورة البقرة «آمَنَ الرَّسُولُ»،", "en": "Al-Fātiḥa seven times, Āyat al-Kursī, and the last verses of Sūrat al-Baqara, “The Messenger believes”,", "zh": "《开端章》七遍,《宝座节》,以及《黄牛章》的末尾几节“使者确信……”,"}, {"a": 215.68, "b": 220.15, "ar": "والإخلاص والفلق والناس، ثلاثًا ثلاثًا.", "en": "and al-Ikhlāṣ, al-Falaq and an-Nās, three times each.", "zh": "还有《忠诚章》《曙光章》《世人章》,各三遍。"}, {"a": 220.65, "b": 228.84, "ar": "أما الفاتحة فقد رقى بها صحابيٌّ مريضًا فشُفي، فقال له النبي ﷺ: «وما يدريك أنها رقية؟»", "en": "As for al-Fātiḥa, a Companion recited it over a sick man and he recovered, and the Prophet (peace be upon him) said to him: “How did you know it is a ruqyah?”", "zh": "至于《开端章》,一位圣门弟子用它为病人诵读,病人痊愈了,先知(愿主福安之)对他说:“你怎么知道它是诵经祛病的经文?”"}, {"a": 228.94, "b": 233.47, "ar": "وعدد السبع من تجارب الرقاة، والمعوَّل عليه حضور القلب.", "en": "The number seven comes from the experience of practitioners; what matters is a present heart.", "zh": "七遍这个数字来自诵经者的经验,真正要紧的是专注的心。"}, {"a": 233.56, "b": 240.72, "ar": "وآية الكرسي: «من قرأها لم يزل عليه من الله حافظ، ولا يقربه شيطانٌ حتى يصبح».", "en": "Āyat al-Kursī: “Whoever recites it will have a guardian from Allah over him, and no devil will come near him until morning.”", "zh": "《宝座节》:“谁诵读它,就会有真主派来的守护者一直守着他,直到天亮,恶魔都不会靠近。”"}, {"a": 240.81, "b": 244.64, "ar": "وخواتيم البقرة: «من قرأهما في ليلةٍ كفتاه».", "en": "The end of al-Baqara: “Whoever recites the two in a night, they will suffice him.”", "zh": "《黄牛章》的末尾:“谁在夜里诵读这两节,它们就足够他用了。”"}, {"a": 244.73, "b": 253.03, "ar": "والمعوذات قال فيها ﷺ: «تقرؤها حين تمسي وحين تصبح ثلاثًا، تكفيك من كل شيء».", "en": "Of the Muʿawwidhāt he (peace be upon him) said: “Recite them when you reach evening and when you reach morning, three times; they will suffice you against everything.”", "zh": "关于护佑三章,他(愿主福安之)说:“傍晚和早晨各诵三遍,它们足以护佑你远离一切。”"}, {"a": 253.6, "b": 257.22, "ar": "الخطوة الثالثة: أدعية النبي ﷺ.", "en": "Step three: the supplications of the Prophet (peace be upon him).", "zh": "第三步:先知(愿主福安之)的祈祷词。"}, {"a": 257.31, "b": 266.68, "ar": "كان يعوّذ الحسن والحسين بقوله: «أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ».", "en": "He used to seek refuge for al-Ḥasan and al-Ḥusayn with the words: “I seek refuge for you in the perfect words of Allah from every devil and every harmful creature, and from every evil eye.”", "zh": "他常这样为哈桑和侯赛因祈求庇护:“我借真主完美的言辞,为你们二人求护佑,远离一切恶魔、一切毒虫和一切邪眼。”"}, {"a": 266.77, "b": 274.06, "ar": "فقولي لطفلك: أُعِيذُكَ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ.", "en": "So say to your child: “I seek refuge for you in the perfect words of Allah from every devil and every harmful creature, and from every evil eye.”", "zh": "你就对孩子说:“我借真主完美的言辞,为你求护佑,远离一切恶魔、一切毒虫和一切邪眼。”"}, {"a": 274.14, "b": 283.98, "ar": "ورقى جبريل عليه السلام النبيَّ ﷺ فقال: «بِاسْمِ اللَّهِ أَرْقِيكَ، مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ، مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ،", "en": "Jibrīl (peace be upon him) performed ruqyah for the Prophet (peace be upon him), saying: “In the name of Allah I perform ruqyah for you, from everything that harms you, from the evil of every soul or envious eye,", "zh": "吉卜利勒(愿主福安之)曾为先知(愿主福安之)诵经祛病,说:“奉真主之名我为你诵经,远离一切伤害你的事物,远离每个灵魂和每只嫉妒之眼的恶害,"}, {"a": 284.07, "b": 287.23, "ar": "اللَّهُ يَشْفِيكَ، بِاسْمِ اللَّهِ أَرْقِيكَ».", "en": "may Allah heal you; in the name of Allah I perform ruqyah for you.”", "zh": "愿真主治愈你;奉真主之名我为你诵经。”"}, {"a": 287.32, "b": 288.04, "ar": "وادعي:", "en": "And pray:", "zh": "并且祈祷:"}, {"a": 288.13, "b": 296.86, "ar": "«اللَّهُمَّ رَبَّ النَّاسِ، أَذْهِبِ الْبَأْسَ، اشْفِهِ وَأَنْتَ الشَّافِي، لَا شِفَاءَ إِلَّا شِفَاؤُكَ، شِفَاءً لَا يُغَادِرُ سَقَمًا».", "en": "“O Allah, Lord of mankind, remove the harm; heal him, for You are the Healer; there is no healing but Your healing, a healing that leaves no illness behind.”", "zh": "“真主啊,世人的养育者,请消除病痛,请治愈他,因为您是治愈者;除您的治愈之外,没有任何治愈,请赐予不留下任何病痛的治愈。”"}, {"a": 296.95, "b": 302.21, "ar": "وقولي سبع مرات: «أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ».", "en": "And say seven times: “I ask Allah the Almighty, Lord of the Mighty Throne, to heal you.”", "zh": "并说七遍:“我祈求伟大的真主,伟大宝座的养育者,治愈你。”"}, {"a": 302.3, "b": 305.02, "ar": "الخطوة الرابعة: ماء الرقية.", "en": "Step four: the water of ruqyah.", "zh": "第四步:诵经之水。"}, {"a": 305.11, "b": 309.63, "ar": "اقرئي هذه السور والأدعية على إناءِ ماء، وانفثي فيه.", "en": "Recite these suras and supplications over a vessel of water, and blow lightly into it.", "zh": "对着一容器水诵读这些章节和祈祷词,并轻轻向其中吹气。"}, {"a": 309.72, "b": 312.64, "ar": "فإن كان الطفل كبيرًا شرب منه،", "en": "If the child is older, he drinks from it,", "zh": "如果孩子大一些,就让他喝一些,"}, {"a": 312.73, "b": 316.92, "ar": "وإن كان رضيعًا فامسحي بالماء وجهه ويديه وقدميه،", "en": "and if he is an infant, wipe his face, hands and feet with the water,", "zh": "如果是婴儿,就用这水擦拭他的脸、手和脚,"}, {"a": 317.01, "b": 319.73, "ar": "وقد أجاز ذلك كثيرٌ من أهل العلم.", "en": "and many scholars have permitted this.", "zh": "许多学者都认为这样做是被允许的。"}, {"a": 319.82, "b": 322.96, "ar": "الخطوة الخامسة: استغفار الوالدين.", "en": "Step five: the parents’ istighfar.", "zh": "第五步:父母的求饶恕。"}, {"a": 323.05, "b": 329.14, "ar": "استغفري ربكِ، فقد يكون هناك سببٌ لا نعلمه، فيكون الاستغفار سببًا في الشفاء.", "en": "Seek your Lord’s forgiveness, for there may be a cause we do not know, and istighfar may become a cause of healing.", "zh": "请向你的养主求饶恕,也许有我们不知道的原因,而求饶恕可以成为治愈的缘由。"}, {"a": 329.23, "b": 341.44, "ar": "قال تعالى على لسان نوح عليه السلام: ﴿فَقُلْتُ اسْتَغْفِرُوا رَبَّكُمْ إِنَّهُ كَانَ غَفَّارًا * يُرْسِلِ السَّمَاءَ عَلَيْكُم مِّدْرَارًا * وَيُمْدِدْكُم بِأَمْوَالٍ وَبَنِينَ﴾", "en": "Allah says on the tongue of Nūḥ (peace be upon him): “I said: seek forgiveness of your Lord, He is ever Forgiving; He will send rain upon you in abundance, and support you with wealth and children.”", "zh": "真主借努哈(愿主福安之)之口说:“我说:你们当向你们的养主求饶恕,他确是至赦的,他将降大雨给你们,并以财产和子嗣援助你们。”"}, {"a": 341.53, "b": 344.98, "ar": "تأمّلي كيف ربط الله الاستغفار بالبركة في الأبناء.", "en": "Reflect how Allah linked istighfar with blessing in children.", "zh": "想一想,真主是如何把求饶恕与子嗣的吉庆联系在一起的。"}, {"a": 345.07, "b": 352.39, "ar": "فأكثري منه يا أماه، وأنتِ في عمل البيت وفي الطريق وبجوار مهد صغيرك، وادعي له بقلبٍ منكسر.", "en": "So make much of it, dear mother, as you do housework, on the road, and beside your little one’s cradle, and pray for him with a broken heart.", "zh": "亲爱的母亲,请多多求饶恕:做家务时、路上、在孩子的摇篮旁,都要如此,并带着谦卑的心为他祈祷。"}, {"a": 352.48, "b": 355.52, "ar": "الخطوة السادسة: اغتسال العائن", "en": "Step six: the washing of the one who cast the eye", "zh": "第六步:施以邪眼者的洗涤"}, {"a": 355.61, "b": 364.17, "ar": "أصيب سهل بن حنيف بالعين فصُرع، فقال النبي ﷺ للذي أصابه: «عَلَامَ يَقْتُلُ أَحَدُكُمْ أَخَاهُ؟ أَلَا بَرَّكْتَ؟»", "en": "Sahl ibn Ḥunayf was struck by the eye and collapsed, and the Prophet (peace be upon him) said to the one who struck him: “Why does one of you kill his brother? Why did you not invoke blessing?”", "zh": "赛赫勒·本·侯奈夫被邪眼所伤而倒下,先知(愿主福安之)对伤他的人说:“你们中的某人为什么要伤害自己的兄弟?你为什么不祈求吉庆呢?”"}, {"a": 364.26, "b": 367.72, "ar": "وأمره أن يغتسل له، فقام سهلٌ معافى.", "en": "And he ordered him to wash for him, and Sahl got up, healed.", "zh": "并命令他为赛赫勒洗涤,赛赫勒随即康复地站了起来。"}, {"a": 367.81, "b": 371.61, "ar": "وقال ﷺ: «وإذا استُغسلتم فاغسلوا».", "en": "And he (peace be upon him) said: “If you are asked to wash, then wash.”", "zh": "他(愿主福安之)说:“若被要求洗涤,你们就洗涤。”"}, {"a": 371.7, "b": 374.65, "ar": "لكن هذا عند اليقين لا بالظن والتخمين،", "en": "But this is only where there is certainty, not suspicion or guesswork,", "zh": "但这只适用于确定的情况,而不是凭猜测和臆断,"}, {"a": 374.74, "b": 377.31, "ar": "ويُطلب بلطفٍ ومن غير خصام.", "en": "and it is requested gently, without dispute.", "zh": "并且要温和地提出,不起争执。"}, {"a": 377.4, "b": 380.54, "ar": "الخطوة السابعة: الصبر والمداومة.", "en": "Step seven: patience and persistence.", "zh": "第七步:耐心与坚持。"}, {"a": 380.63, "b": 385.92, "ar": "الرقية ليست عمل يومٍ واحد، داومي عليها أيامًا وأسابيع ولا تيأسي،", "en": "Ruqyah is not the work of a single day; keep at it for days and weeks and do not despair,", "zh": "诵经祛病不是一天的事,请坚持数日、数周,不要灰心,"}, {"a": 386.01, "b": 388.93, "ar": "فالشفاء يأتي في الوقت الذي يريده الله.", "en": "for healing comes at the time Allah wills.", "zh": "因为治愈会在真主所意欲的时刻到来。"}, {"a": 389.02, "b": 390.52, "ar": "واحذري الدجالين.", "en": "And beware of charlatans.", "zh": "还要提防骗子。"}, {"a": 390.61, "b": 398.37, "ar": "قال ﷺ: «لا بأس بالرُّقى ما لم يكن فيه شرك»، وقال: «من علّق تميمةً فقد أشرك».", "en": "He (peace be upon him) said: “There is no harm in ruqyah as long as it contains no shirk,” and said: “Whoever hangs an amulet has committed shirk.”", "zh": "他(愿主福安之)说:“只要不含举伴,诵经祛病无妨。”又说:“谁佩戴护身符,谁就是举伴了。”"}, {"a": 398.46, "b": 409.41, "ar": "فإن كتب أحدٌ لطفلك طلسمًا، أو أعطاك ورقةً بكلامٍ غير مفهوم، أو سألك عن اسم أمّك، أو طلب ذبح حيوان، فاعلمي أن هذا ليس طريق الشرع.", "en": "If someone writes a talisman for your child, hands you a paper of unintelligible words, asks for your mother’s name, or asks you to slaughter an animal, know that this is not the way of the sharīʿa.", "zh": "如果有人给你的孩子写符咒,递给你一张看不懂的纸,询问你母亲的名字,或要求宰杀牲畜,请知道这不是教法之道。"}, {"a": 409.5, "b": 417.23, "ar": "الرقية الشرعية قرآنٌ وأدعيةٌ نبوية، بلسانٍ واضحٍ تفهمينه، وأنتِ وأبوه أولى الناس بأن تقرؤوها عليه.", "en": "Sharʿī ruqyah is Qur’an and prophetic supplications, in clear words you understand, and you and his father are the people most entitled to recite it over him.", "zh": "合乎教法的诵经祛病就是《古兰经》和先知的祈祷词,用你听得懂的清晰语言诵读,你和他的父亲最有资格为他诵读。"}, {"a": 417.32, "b": 421.35, "ar": "وتذكّري قوله ﷺ: «تداووا عباد الله».", "en": "And remember his saying (peace be upon him): “Seek treatment, servants of Allah.”", "zh": "并请记住他(愿主福安之)的话:“真主的仆人们,你们要就医。”"}, {"a": 421.44, "b": 424.78, "ar": "فالرقية لا تلغي الأخذ بالأسباب، بل تُسانِدها،", "en": "Ruqyah does not cancel taking the means; it supports them,", "zh": "诵经祛病并不取代采取措施,而是与之相辅相成,"}, {"a": 424.87, "b": 427.45, "ar": "والوقاية خيرٌ من انتظار البلاء.", "en": "and prevention is better than waiting for affliction.", "zh": "预防胜过等待灾祸降临。"}, {"a": 427.54, "b": 433.82, "ar": "إذا أعجبك شيءٌ من طفلٍ فقولي: ما شاء الله لا قوة إلا بالله، أو: بارك الله فيه.", "en": "If something about a child impresses you, say: “What Allah wills, there is no power but with Allah,” or: “May Allah bless him.”", "zh": "如果你喜欢某个孩子的某一点,请说:“这是真主的意愿,除非借真主,没有力量。”或:“愿真主祝福他。”"}, {"a": 433.91, "b": 439.83, "ar": "قال تعالى: ﴿وَلَوْلَا إِذْ دَخَلْتَ جَنَّتَكَ قُلْتَ مَا شَاءَ اللَّهُ لَا قُوَّةَ إِلَّا بِاللَّهِ﴾", "en": "Allah says: “If only, when you entered your garden, you had said: What Allah wills; there is no power but with Allah.”", "zh": "真主说:“当你进入你的园圃时,你为什么不说:‘这是真主的意愿,除非借真主,没有力量’呢?”"}, {"a": 439.92, "b": 445.8, "ar": "وقال ﷺ: «إذا رأى أحدكم من أخيه ما يعجبه فليدعُ له بالبركة».", "en": "And he (peace be upon him) said: “If one of you sees something he admires in his brother, let him invoke blessing for him.”", "zh": "他(愿主福安之)说:“你们中若有人看到兄弟身上令他喜欢的东西,就让他为他祈求吉庆。”"}, {"a": 445.89, "b": 453.19, "ar": "وقلّلي من نشر صور طفلك ولحظاته الخاصة على مواقع التواصل، فليست كل نظرةٍ مصحوبةً بالدعاء.", "en": "And share fewer of your child’s pictures and private moments on social media, for not every glance comes with a prayer.", "zh": "也请少在社交媒体上发布孩子的照片和私密时刻,因为并不是每一道目光都伴有祈祷。"}, {"a": 453.28, "b": 458.88, "ar": "وحصّنيه صباحًا ومساءً بتعويذة النبي ﷺ، وقولي ثلاثًا:", "en": "Protect him morning and evening with the Prophet’s protective words (peace be upon him), and say three times:", "zh": "每天早晚用先知(愿主福安之)的护佑词保护他,并说三遍:"}, {"a": 458.97, "b": 464.07, "ar": "«بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ».", "en": "“In the name of Allah, with whose name nothing on earth or in heaven can cause harm, and He is the All-Hearing, the All-Knowing.”", "zh": "“奉真主之名,有他的名字在,天地间任何事物都不能为害;他是全听的,全知的。”"}, {"a": 464.16, "b": 471.57, "ar": "وأحيي بيتك بالقرآن، فقد أخبر ﷺ أن الشيطان ينفر من البيت الذي تُقرأ فيه سورة البقرة.", "en": "And fill your home with Qur’an, for he (peace be upon him) told us that the devil flees from a house in which Sūrat al-Baqara is recited.", "zh": "也请让你的家充满《古兰经》的诵读,因为他(愿主福安之)告诉我们,恶魔会逃离诵读《黄牛章》的房子。"}, {"a": 471.66, "b": 475.97, "ar": "وخلاصة القول: العين حق، لكن الله أكبر من كل نظرة،", "en": "In short: the eye is real, but Allah is greater than every glance,", "zh": "总之:邪眼是真实的,但真主比任何目光都伟大,"}, {"a": 476.06, "b": 479.2, "ar": "والقرآن شفاء، لكن الشافي هو الله،", "en": "the Qur’an is healing, but the Healer is Allah,", "zh": "《古兰经》是治疗,但治愈者是真主,"}, {"a": 479.29, "b": 483.32, "ar": "والوالدان هما أول من يرقي الطفل، وأولى الناس بذلك.", "en": "and the parents are the first to recite ruqyah over the child and the people most entitled to do so.", "zh": "父母是第一个为孩子诵经祛病的人,也是最有资格的人。"}, {"a": 483.41, "b": 492.87, "ar": "إن كنتَ تعرف أمًّا تسهر الليالي بجوار مهد صغيرها فأرسل لها هذا المقطع، واكتب في التعليقات دعاءً لكل طفلٍ مريض.", "en": "If you know a mother who stays up nights beside her little one’s cradle, send her this clip, and write in the comments a prayer for every sick child.", "zh": "如果你认识一位在孩子摇篮边彻夜难眠的母亲,请把这段视频发给她,并在评论中为每一个生病的孩子写下祈祷。"}, {"a": 492.96, "b": 497.08, "ar": "«اللَّهُمَّ اشْفِ أَطْفَالَنَا وَأَطْفَالَ الْمُسْلِمِينَ، وَأَلْبِسْهُمْ ثَوْبَ الْعَافِيَةِ».", "en": "“O Allah, heal our children and the children of the Muslims, and clothe them in the garment of well-being.”", "zh": "“真主啊,求您治愈我们的孩子和穆斯林的孩子们,并让他们穿上安康的衣裳。”"}, {"a": 497.17, "b": 497.98, "ar": "آمين.", "en": "Amen.", "zh": "阿敏。"}], SECS = [{"a": 0.0, "b": 40.4, "ar": "قصة أمٍّ وطفلها", "en": "A mother and her baby", "col": "#f4b6c2", "ic": "babycry", "items": [[2.7, "c", "زيارة عند بعض الناس", "w", "house", 0], [9.2, "c", "خاطر: أخشى أن يصاب بالعين", "y", "eye", 0], [12.0, "c", "في السيارة.. تقيّأ مرتين", "p", "car", 0], [19.9, "c", "بكاء لا يهدأ ولا نوم", "r", "moon", 1], [24.9, "c", "خمسة أشهر أو ستة", "w", "clock", 1], [27.0, "c", "وكل ما جرّبوه لم يُجْدِ", "w", "x", 1], [29.6, "c", "رقية شرعية + استغفار", "g", "book", 2], [38.3, "c", "والشفاء بيد الله وحده", "g", "shield", 2]]}, {"a": 40.4, "b": 57.9, "ar": "في هذه الحلقة", "en": "In this episode", "col": "#9fd3d6", "ic": "book", "items": [[43.3, "c", "ما جاء في الكتاب والسنة عن العين", "y", "book", 0], [47.0, "c", "كيف نعالجها ونقي أطفالنا", "g", "shield", 0], [52.8, "c", "برنامج يومي متكامل", "p", "calendar", 0], [55.2, "c", "ابدئي به من الليلة", "w", "moon", 0]]}, {"a": 57.9, "b": 88.5, "ar": "العين.. حقيقة أم وهم؟",
