 Mu‘awwidhatayn,", "zh": "并诵读两章护佑章,"}, {"a": 33.95, "b": 35.31, "ar": "لا طلاسم ولا شعوذة", "en": "not cryptic charms or sorcery.", "zh": "而不是什么符咒或巫术。"}, {"a": 37.5, "b": 41.91, "ar": "فلا تخف من السحر حتى تترك العلاج، ولا تنسب كل ما يصيبك إليه", "en": "So do not fear sihr to the point of abandoning treatment, and do not blame everything that befalls you on it.", "zh": "所以,不要因害怕巫术而放弃治疗,也不要把你遇到的每件事都归咎于它。"}, {"a": 42.41, "b": 45.93, "ar": "حصّن نفسك بالأذكار وراجع الطبيب إن استمرت الأعراض", "en": "Protect yourself with the adhkar, and see a doctor if the symptoms persist.", "zh": "用祈祷词护佑自己;如果症状持续,请去看医生。"}, {"a": 46.41, "b": 49.56, "ar": "شارك هذه القصة مع من تحب، وتابع القناة", "en": "Share this story with someone you love, and follow the channel.", "zh": "把这个故事分享给你爱的人,并关注本频道。"}];
