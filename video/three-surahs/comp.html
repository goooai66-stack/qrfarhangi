<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Cairo"; src: url(fonts/Cairo.ttf) format("truetype"); font-weight: 200 1000; }
@font-face { font-family: "Reem Kufi"; src: url(fonts/ReemKufi.ttf) format("truetype"); font-weight: 400 700; }
@font-face { font-family: "Amiri"; src: url(fonts/Amiri-Regular.woff) format("woff"); font-weight: 400; }
@font-face { font-family: "Amiri"; src: url(fonts/Amiri-Bold.woff) format("woff"); font-weight: 700; }
@font-face { font-family: "Noto Sans SC"; src: url(fonts/NotoSansSC-subset.woff2) format("woff2"); font-weight: 500 700; }
:root { --silver: #e9efff; --amber: #ffb454; --ink: #1a1f55; --paper: #f4ead6; --mute: #c3c9ee; --violet: #9c8cff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #060a22; }
body { font-family: "Cairo", sans-serif; color: var(--silver); }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.a { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; }
.scn { position: absolute; inset: 0; }
.amiri { font-family: "Amiri", serif; font-weight: 700; }
.kufi { font-family: "Reem Kufi", sans-serif; font-weight: 700; }
.w { display: inline-block; }
.w.k { color: var(--amber); }
svg { overflow: visible; display: block; }
.plate { display: inline-block; background: linear-gradient(170deg, #2a2f7e, #1b1f5c); border: 3px solid var(--violet); border-radius: 18px; padding: 6px 34px 14px;
  font-weight: 800; font-size: 54px; color: var(--silver); box-shadow: 0 14px 20px rgba(0,0,0,.45); }
.plate small { display: block; font-size: 34px; font-weight: 600; color: var(--mute); margin-top: -8px; }
.chip { display: inline-flex; align-items: center; gap: 18px; background: rgba(20,24,80,.78); border: 3px solid var(--amber); border-radius: 999px; padding: 4px 36px 12px;
  font-weight: 800; font-size: 50px; color: var(--silver); box-shadow: 0 12px 18px rgba(0,0,0,.4); }
.card { width: 260px; height: 350px; border-radius: 20px; background: linear-gradient(170deg, #f7eedb, #e6d9bb); color: var(--ink); text-align: center;
  box-shadow: 0 22px 30px rgba(0,0,0,.5), 0 0 0 7px rgba(255,180,84,.28); }
.card::before { content: ""; position: absolute; inset: 14px; border: 3px solid #c98b2c; border-radius: 12px; }
.card .num { position: absolute; left: 0; right: 0; top: 34px; font-family: "Reem Kufi"; font-weight: 700; font-size: 74px; color: #b8741a; }
.card .nm { position: absolute; left: 0; right: 0; top: 150px; font-family: "Amiri"; font-weight: 700; font-size: 70px; line-height: 1.2; }
.card svg { position: absolute; left: 90px; top: 270px; }
.bub { position: relative; background: var(--paper); color: var(--ink); border: 6px solid var(--amber); border-radius: 36px; padding: 6px 56px 22px;
  font-family: "Amiri"; font-weight: 700; font-size: 150px; line-height: 1.15; box-shadow: 0 16px 24px rgba(0,0,0,.5); }
.bub.s { border-color: var(--violet); font-size: 76px; padding: 10px 46px 24px; }
.bub::after { content: ""; position: absolute; bottom: -30px; left: 54px; width: 0; height: 0; border-left: 22px solid transparent; border-right: 22px solid transparent; border-top: 34px solid var(--amber); }
.bub.s::after { border-top-color: var(--violet); left: auto; right: 54px; }
.dot { display: inline-block; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); margin: 0 9px; }
#cap { position: absolute; left: 110px; right: 110px; bottom: 600px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
#cap .ar { font-weight: 800; font-size: 54px; line-height: 1.45; color: var(--silver); text-shadow: 0 2px 14px rgba(0,0,6,.9); }
#cap .zh { font-family: "Noto Sans SC", "Cairo", sans-serif; font-weight: 700; font-size: 42px; line-height: 1.4; color: #ffd9a0; direction: ltr; text-shadow: 0 2px 14px rgba(0,0,6,.9); }
#cap .en { font-weight: 600; font-size: 35px; line-height: 1.35; color: var(--mute); direction: ltr; text-shadow: 0 2px 14px rgba(0,0,6,.9); }
</style>
</head>
