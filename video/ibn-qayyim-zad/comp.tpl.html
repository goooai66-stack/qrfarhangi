<style>

:root { --ink: #12404a; --paper: #f6ebd4; --cream: #fff8e8; --gold: #e0a100; --cor: #e4572e; --grn: #2a9d8f; --vio: #7b6cd9; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #e6d3a8; }
body { font-family: "Cairo", sans-serif; color: var(--ink); }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.a { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; }
.scn { position: absolute; inset: 0; }
.amiri { font-family: "Amiri", serif; font-weight: 700; }
svg { overflow: visible; display: block; }
.chip { display: inline-block; background: var(--cream); border: 5px solid var(--ink); border-radius: 26px; padding: 2px 36px 10px; font-weight: 800; font-size: 54px; color: var(--ink); box-shadow: 0 9px 0 rgba(18,64,74,.2); }
.chip.y { background: #ffe9a8; border-color: #b98300; } .chip.c { background: #ffd9cc; border-color: var(--cor); color: #a8320f; } .chip.m { background: #cdeedd; border-color: var(--grn); } .chip.b { background: #d9e8ff; border-color: #3b6fb6; }
.bub { position: relative; background: var(--cream); border: 6px solid var(--ink); border-radius: 40px; padding: 4px 54px 22px; font-family: "Amiri"; font-weight: 700; font-size: 82px; line-height: 1.3; color: var(--ink); box-shadow: 0 12px 0 rgba(18,64,74,.2); }
.bub.mid::after { left: calc(50% - 26px); }
.bub::after { content: ""; position: absolute; bottom: -40px; left: 200px; border-left: 26px solid transparent; border-right: 26px solid transparent; border-top: 40px solid var(--ink); }
#cap { position: absolute; left: 110px; right: 110px; top: 1002px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
#cap .ar { font-weight: 800; font-size: 54px; line-height: 1.45; color: #10302a; text-shadow: none; }
#cap .zh { font-family: "Noto Sans SC", "Cairo", sans-serif; font-weight: 700; font-size: 42px; line-height: 1.4; color: #8a5a00; direction: ltr; text-shadow: none; }
#cap .en { font-weight: 600; font-size: 35px; line-height: 1.35; color: #3f524c; direction: ltr; text-shadow: none; }
</style>
</head>

    <svg class="layer" width="1080" height="1920" viewBox="0 0 1080 1920" aria-hidden="true"><path id="gx1" d="M380,590 L700,720" fill="none" stroke="#ff8a65" stroke-width="16" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><path id="gx2" d="M700,590 L380,720" fill="none" stroke="#ff8a65" stroke-width="16" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>

    <div id="g1" class="a"><span class="chip" style="font-size:46px; border-style:dashed; opacity:.85">الذكر</span></div>

    <svg id="mush" class="a" width="300" height="208" viewBox="0 0 680 470" aria-hidden="true"></svg><div id="lQ" class="a"><span class="chip m" style="font-size:48px">القرآن</span></div>
    <svg id="star2" class="a" width="190" height="190" viewBox="-95 -95 190 190"><polygon id="st2P" fill="#ffe9a8" stroke="#b98300" stroke-width="8" stroke-linejoin="round"/></svg><div id="lA" class="a"><span class="chip y" style="font-size:48px">الأذكار</span></div>

<script>
const W = 1080, H = 1920, CAPS = __CAPS__;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const EZ = { lin: (x) => x, out: (x) => 1 - Math.pow(1 - x, 3), in: (x) => x * x * x, io: (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  pop: (x) => { const c1 = 2.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); } };
function tw(t, k) {
  if (typeof k === "number") return k; if (typeof k === "function") return k(t);
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (t <= k[i][0]) { const [t0, v0] = k[i - 1], [t1, v1, e = "out"] = k[i]; return v0 + (v1 - v0) * EZ[e](clamp((t - t0) / ((t1 - t0) || 1))); }
  return k[k.length - 1][1];
}
const rng = (seed) => { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; };
const NS = "http://www.w3.org/2000/svg";
const mk = (tag, at, parent) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); parent && parent.appendChild(e); return e; };
const ITEMS = [], DRAWS = [], SCN = [], BURSTS = [], CUST = [];
const A = (id, sp) => ITEMS.push([typeof id === "string" ? $(id) : id, sp]);
const D = (el, k) => DRAWS.push([typeof el === "string" ? $(el) : el, k]);
const SC = (id, a, b) => SCN.push({ el: $(id), a, b });
const pop = (t, d = 0.4) => [[t - 0.001, 0.6], [t + d, 1, "pop"]];
const inc = (t0, t1, k = "out") => [[t0, 1], [t1, 0, k]];
const on = (a, b, d = 0.2) => [[a - 0.001, 0], [a, 1], [b, 1], [b + d, 0, "in"]];
function spiral(id, turns, r) { let d = ""; for (let i = 0; i <= 60; i++) { const a = i / 60 * turns * Math.PI * 2, rr = r * (0.18 + 0.82 * i / 60); d += (i ? " L" : "M") + (rr * Math.cos(a)).toFixed(1) + "," + (rr * Math.sin(a)).toFixed(1); } $(id).setAttribute("d", d); }
function star(id, r, ri) { const pts = []; for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8 - Math.PI / 2, q = i % 2 ? ri : r; pts.push(`${(q * Math.cos(a)).toFixed(1)},${(q * Math.sin(a)).toFixed(1)}`); } $(id).setAttribute("points", pts.join(" ")); }
spiral("swP", 2.6, 118); star("bkS", 28, 14); spiral("sw3P", 2.4, 200); star("st2P", 86, 62);
function spread(text, a, b) {
  const ws = text.split(/\s+/), cl = (w) => w.replace(/[ً-ْٰ]/g, ""), wt = ws.map((w) => cl(w).length + 0.6), tot = wt.reduce((p, c) => p + c, 0);
  let c = 0; return ws.map((w, i) => { const t = a + (b - a) * c / tot; c += wt[i]; return [w, t]; });
}
// background pattern: 8-point stars
for (const [svg, w, h] of [[$("pat"), 1080, 960], [$("pat2"), 1080, 960]]) { const col = svg === $("pat") ? "#e8c872" : "#12404a"; for (let y = 0; y < h + 120; y += 120) for (let x = 0; x < w + 120; x += 120) { const o = (y / 120) % 2 ? 60 : 0;
  mk("rect", { x: x + o - 34, y: y - 34, width: 68, height: 68, fill: "none", stroke: col, "stroke-width": 3 }, svg); mk("rect", { x: x + o - 34, y: y - 34, width: 68, height: 68, fill: "none", stroke: col, "stroke-width": 3, transform: `rotate(45 ${x + o} ${y})` }, svg); } }
function book(svg, w, h) { const r = rng(11), cx = w / 2; mk("path", { d: `M${cx},${h * .08} L${w * .02},${h * .02} L${w * .02},${h * .94} L${cx},${h} L${w * .98},${h * .94} L${w * .98},${h * .02} Z`, fill: "#cdeedd", stroke: "#2a9d8f", "stroke-width": 14, "stroke-linejoin": "round" }, svg);
  mk("line", { x1: cx, y1: h * .06, x2: cx, y2: h * .97, stroke: "#2a9d8f", "stroke-width": 10 }, svg);
  for (const side of [-1, 1]) for (let i = 0; i < 6; i++) { const y = h * (.2 + i * .1), x0 = side < 0 ? w * .08 : cx + w * .06; mk("line", { x1: x0, y1: y, x2: x0 + w * (.3 + r() * .1), y2: y, stroke: "#12404a", "stroke-width": 9, "stroke-linecap": "round", opacity: .75 }, svg); } }
book($("mush"), 680, 470);

// ---- anchors from the voice ------------------------------------------------------------------------
const Q1 = spread("قصة شيخ الإسلام ابن تيمية مع المصروع", 0.29, 2.69);
const Q2 = spread("كما رواها تلميذه ابن القيم", 2.99, 4.61);
const Q3 = spread("يقول ابن القيم في زاد المعاد", 5.27, 6.91);
const Q4 = spread("وشهدت شيخنا يرسل إلى المصروع من يخاطب الروح التي فيه", 7.3, 11.09);
const Q6 = spread("فإن هذا لا يحل لك فيفيق المصروع", 14.1, 17.09);
