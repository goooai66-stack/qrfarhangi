<script>
const W = 1080, H = 1920, CAPS = __CAPS__;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const EZ = { lin: (x) => x, out: (x) => 1 - Math.pow(1 - x, 3), in: (x) => x * x * x, io: (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  pop: (x) => { const c1 = 2.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); } };
function tw(t, k) {
  if (typeof k === "number") return k; if (typeof k === "function") return k(t);
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (t <= k[i][0]) { const [t0, v0] = k[i - 1], [t1, v1, e = "out"] = k[i]; return v0 + (v1 - v0) * EZ[e](clamp((t - t0) / ((t1 - t0) || 1))); }

}
const rng = (seed) => { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; };
const NS = "http://www.w3.org/2000/svg";
const mk = (tag, at, parent) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); parent && parent.appendChild(e); return e; };

const pop = (t, d = 0.4) => [[t - 0.001, 0.6], [t + d, 1, "pop"]];
const inc = (t0, t1, k = "out") => [[t0, 1], [t1, 0, k]];
const on = (a, b, d = 0.2) => [[a - 0.001, 0], [a, 1], [b, 1], [b + d, 0, "in"]];
function spiral(id, turns, r) { let d = ""; for (let i = 0; i <= 60; i++) { const a = i / 60 * turns * Math.PI * 2, rr = r * (0.18 + 0.82 * i / 60); d += (i ? " L" : "M") + (rr * Math.cos(a)).toFixed(1) + "," + (rr * Math.sin(a)).toFixed(1); } $(id).setAttribute("d", d); }
function star(id, r, ri) { const pts = []; for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8 - Math.PI / 2, q = i % 2 ? ri : r; pts.push(`${(q * Math.cos(a)).toFixed(1)},${(q * Math.sin(a)).toFixed(1)}`); } $(id).setAttribute("points", pts.join(" ")); }

function spread(text, a, b) {
  const ws = text.split(/\s+/), cl = (w) => w.replace(/[ً-ْٰ]/g, ""), wt = ws.map((w) => cl(w).length + 0.6), tot = wt.reduce((p, c) => p + c, 0);
  let c = 0; return ws.map((w, i) => { const t = a + (b - a) * c / tot; c += wt[i]; return [w, t]; });
}
// background pattern: 8-point stars
for (const [svg, w, h] of [[$("pat"), 1080, 960], [$("pat2"), 1080, 960]]) { const col = svg === $("pat") ? "#ffffff" : "#12404a"; for (let y = 0; y < h + 120; y += 120) for (let x = 0; x < w + 120; x += 120) { const o = (y / 120) % 2 ? 60 : 0;
  mk("rect", { x: x + o - 34, y: y - 34, width: 68, height: 68, fill: "none", stroke: col, "stroke-width": 3 }, svg); mk("rect", { x: x + o - 34, y: y - 34, width: 68, height: 68, fill: "none", stroke: col, "stroke-width": 3, transform: `rotate(45 ${x + o} ${y})` }, svg); } }

  mk("line", { x1: cx, y1: h * .06, x2: cx, y2: h * .97, stroke: "#2a9d8f", "stroke-width": 10 }, svg);
  for (const side of [-1, 1]) for (let i = 0; i < 6; i++) { const y = h * (.2 + i * .1), x0 = side < 0 ? w * .08 : cx + w * .06; mk("line", { x1: x0, y1: y, x2: x0 + w * (.3 + r() * .1), y2: y, stroke: "#12404a", "stroke-width": 9, "stroke-linecap": "round", opacity: .75 }, svg); } }


// ---- builders ---------------------------------------------------------------------------------------------------------
const INK = "#12404a";
const box = (w, h, vb, parent) => mk("svg", { width: w, height: h, viewBox: vb, class: "a" }, parent);
function chipEl(parent, txt, cls = "", size = 54, amiri = false) { const d = document.createElement("div"); d.className = "a"; const s = document.createElement("span"); s.className = "chip " + cls; s.style.fontSize = size + "px"; if (amiri) { s.style.fontFamily = "Amiri"; s.style.fontWeight = 700; } s.textContent = txt; d.appendChild(s); parent.appendChild(d); return d; }
function sunEl(p) { const s = box(220, 220, "-110 -110 220 220", p); for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; mk("line", { x1: Math.cos(a) * 70, y1: Math.sin(a) * 70, x2: Math.cos(a) * 100, y2: Math.sin(a) * 100, stroke: "#b56b00", "stroke-width": 9, "stroke-linecap": "round" }, s); } mk("circle", { r: 56, fill: "#ffc93c", stroke: "#b56b00", "stroke-width": 7 }, s); return s; }
function moonEl(p) { const s = box(220, 220, "-110 -110 220 220", p); mk("path", { d: "M30,-90 A92,92 0 1 0 30,90 A72,72 0 1 1 30,-90 Z", fill: "#fff4d6", stroke: "#6f66b8", "stroke-width": 7, "stroke-linejoin": "round" }, s); return s; }
function shieldEl(p) { const s = box(330, 380, "0 0 330 380", p); mk("path", { d: "M165,14 C120,44 70,50 22,50 V190 C22,280 90,336 165,368 C240,336 308,280 308,190 V50 C260,50 210,44 165,14 Z", fill: "rgba(255,214,102,.28)", stroke: "#e0a100", "stroke-width": 14, "stroke-linejoin": "round" }, s); return s; }
function eyeEl(p) { const s = box(200, 130, "0 0 200 130", p); mk("path", { d: "M10,65 Q100,-15 190,65 Q100,145 10,65 Z", fill: "#fff8e8", stroke: INK, "stroke-width": 8, "stroke-linejoin": "round" }, s); mk("circle", { cx: 100, cy: 65, r: 30, fill: "#6f66b8", stroke: INK, "stroke-width": 6 }, s); mk("circle", { cx: 100, cy: 65, r: 12, fill: INK }, s); return s; }
function scrollEl(p, w = 200, dashed = false) { const s = box(w, w * 1.1, "0 0 200 220", p); mk("rect", { x: 20, y: 14, width: 160, height: 192, rx: 20, fill: "#fff8e8", stroke: "#b98300", "stroke-width": 9, "stroke-dasharray": dashed ? "16 12" : "none" }, s); for (let i = 0; i < 5; i++) mk("line", { x1: 46, y1: 52 + i * 34, x2: 154 - (i % 2) * 30, y2: 52 + i * 34, stroke: INK, "stroke-width": 8, "stroke-linecap": "round", opacity: .75 }, s); return s; }
function tickEl(p, w = 200) { const s = box(w, w, "0 0 100 100", p); const t = mk("path", { d: "M18,54 L42,78 L86,24", fill: "none", stroke: "#2a9d8f", "stroke-width": 13, "stroke-linecap": "round", "stroke-linejoin": "round", pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1 }, s); return [s, t]; }
function crossEl(p, w = 220, col = "#e4572e") { const s = box(w, w, "0 0 100 100", p); const a = mk("path", { d: "M14,14 L86,86", stroke: col, "stroke-width": 11, "stroke-linecap": "round", pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1 }, s), b = mk("path", { d: "M86,14 L14,86", stroke: col, "stroke-width": 11, "stroke-linecap": "round", pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1 }, s); return [s, a, b]; }
function arrowEl(p, x1, y1, x2, y2, col = "#e0a100") { const s = mk("svg", { width: 1080, height: 1920, viewBox: "0 0 1080 1920", class: "layer" }, p); const a = Math.atan2(y2 - y1, x2 - x1), h = 46, d = `M${x1},${y1} L${x2},${y2} M${x2 - h * Math.cos(a - .5)},${y2 - h * Math.sin(a - .5)} L${x2},${y2} L${x2 - h * Math.cos(a + .5)},${y2 - h * Math.sin(a + .5)}`; return mk("path", { d, fill: "none", stroke: col, "stroke-width": 12, "stroke-linecap": "round", "stroke-linejoin": "round", pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1 }, s); }
const appear = (t, a = 0, d = .2) => [[t - 0.001, 0], [t, 1]];
const seg = (a, b, d = .25) => [[a - 0.001, 0], [a, 1], [b, 1], [b + d, 0, "in"]];
const SS = (el, t, to, d = .25, extra = {}) => A(el, Object.assign({ s: pop(t), o: seg(t, to, d) }, extra));
const star16 = (r, ri) => { const pts = []; for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8 - Math.PI / 2, q = i % 2 ? ri : r; pts.push(`${(q * Math.cos(a)).toFixed(1)},${(q * Math.sin(a)).toFixed(1)}`); } return pts.join(" "); };

function cupEl(p) { const s = box(180, 220, "0 0 180 220", p); mk("path", { d: "M26,30 H154 L138,196 Q137,208 125,208 H55 Q43,208 42,196 Z", fill: "#e9fbff", stroke: INK, "stroke-width": 8, "stroke-linejoin": "round" }, s); mk("path", { d: "M34,92 Q62,76 90,92 T146,92 L138,196 Q137,208 125,208 H55 Q43,208 42,196 Z", fill: "#4ec3df", stroke: INK, "stroke-width": 6, "stroke-linejoin": "round" }, s); return s; }
function bookEl(p, label) { const s = box(300, 380, "0 0 330 420", p); mk("rect", { x: 22, y: 14, width: 296, height: 392, rx: 22, fill: "#0f5a7a", stroke: "#e8c872", "stroke-width": 10 }, s); mk("path", { d: "M54,14 V406", stroke: "#e8c872", "stroke-width": 6 }, s); const lines = label.split("|"); lines.forEach((l, i) => { const t = mk("text", { x: 188, y: 190 + i * 86 - (lines.length - 1) * 30, "text-anchor": "middle", "font-family": "Amiri", "font-weight": 700, "font-size": 74, fill: "#fff4d6" }, s); t.textContent = l; }); return s; }

  for (const side of [-1, 1]) for (let i = 0; i < 6; i++) { const y = h * (.2 + i * .1), x0 = side < 0 ? wd * .08 : cx + wd * .06; mk("line", { x1: x0, y1: y, x2: x0 + wd * (.3 + r() * .1), y2: y, stroke: INK, "stroke-width": 9, "stroke-linecap": "round", opacity: .75 }, s); } return s; }
function medEl(p, w = 220) { const s = box(w, w, "0 0 240 240", p); mk("circle", { cx: 120, cy: 120, r: 108, fill: "#fff", stroke: "#e4572e", "stroke-width": 9 }, s); mk("path", { d: "M98,52 H142 V98 H188 V142 H142 V188 H98 V142 H52 V98 H98 Z", fill: "#e4572e", stroke: "#a8320f", "stroke-width": 6, "stroke-linejoin": "round" }, s); return s; }
function pillEl(p, w = 220) { const s = box(w, w, "0 0 240 240", p); const g = mk("g", { transform: "rotate(-40 120 120)" }, s); mk("rect", { x: 30, y: 78, width: 180, height: 84, rx: 42, fill: "#fff", stroke: INK, "stroke-width": 8 }, g); mk("path", { d: "M120,78 H72 A42,42 0 0 0 72,162 H120 Z", fill: "#ffb347", stroke: INK, "stroke-width": 8, "stroke-linejoin": "round" }, g); return s; }
function plateEl(p, txt, cls = "m", size = 62) { return chipEl(p, txt, cls, size, true); }
function circleTick(p, d = 230) { const s = box(d, d, "0 0 100 100", p); mk("circle", { cx: 50, cy: 50, r: 46, fill: "#cdeedd", stroke: "#2a9d8f", "stroke-width": 6 }, s); const t = mk("path", { d: "M26,52 L44,70 L76,32", fill: "none", stroke: "#1b6f64", "stroke-width": 10, "stroke-linecap": "round", "stroke-linejoin": "round", pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1 }, s); return [s, t]; }
const ACT = $("act");

// ---- anchors ----------------------------------------------------------------------------------------------------------------------
const A1 = spread("ماذا فعل ابن القيم حين مرض في مكة", 0.3, 2.64), A2 = spread("ولم يجد طبيبا ولا دواء", 2.89, 4.88);
const B1 = spread("يحكي الإمام ابن القيم رحمه الله في زاد المعاد", 5.65, 8.4), tB2 = 8.52;
const C1 = spread("مر بوقت بمكة مرض فيه", 10.19, 12.14), C2 = spread("وفقد الطبيب والدواء", 12.58, 14.17);
const D1 = spread("فكان يعالج نفسه بالفاتحة", 15.01, 16.6), D2 = spread("يأخذ شربة من ماء زمزم", 16.87, 18.56), D3 = spread("ويقرأ عليها الفاتحة مرارا ثم يشربها", 18.82, 21.52);
const E2 = spread("فوجدت بذلك البرء التام", 22.75, 24.37), F1 = spread("ثم صرت أعتمد ذلك عند كثير من الأوجاع", 24.83, 27.67), F2 = spread("فانتفعت بها غاية الانتفاع", 27.94, 29.8);
const G1 = spread("هذه تجربة عالم جليل حين قطعت به الأسباب", 30.56, 33.8), H1 = spread("لا تعني أن نترك الطبيب متى كان موجودا", 34.22, 36.45), H2 = spread("فاجمع بين الفاتحة والعلاج", 36.99, 38.74);
const I1 = spread("وقل كما قال النبي صلى الله عليه وسلم", 38.94, 41.51), J = spread("شارك هذه القصة مع من تحب", 45.27, 46.93), tFol = 47.21;

// ---- the sand at the bottom, the water above ----------------------------------------------------------------------------------------
A("low", { x: 540, y: 1440, o: 1 }); A("pat2", { x: 540, y: 1440, o: .06 }); A("band", { x: 540, y: 967, o: 1 });
A("orb", { x: 880, y: 250, s: (t) => 1 + 0.04 * Math.sin(t * 1.4), o: .55 });
CUST.push((t) => { $("orb").style.boxShadow = `0 0 ${100 + 20 * Math.sin(t * 1.4)}px 30px rgba(255,255,255,.35)`; });
const mkPlate = (S, x, y, t, to) => { const pl = plateEl(S, "ابن القيم", "m", 64); A(pl, { x, y, s: pop(t), o: seg(t, to, .25) }); BURSTS.push({ t: t + 0.3, x, y }); return pl; };

// ---- SA ---------------------------------------------------------------------------------------------------------------------------------------
