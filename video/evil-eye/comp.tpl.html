<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Cairo"; src: url(fonts/Cairo.ttf) format("truetype"); font-weight: 200 1000; }
@font-face { font-family: "Reem Kufi"; src: url(fonts/ReemKufi.ttf) format("truetype"); font-weight: 400 700; }
@font-face { font-family: "Amiri"; src: url(fonts/Amiri-Regular.woff) format("woff"); font-weight: 400; }
@font-face { font-family: "Amiri"; src: url(fonts/Amiri-Bold.woff) format("woff"); font-weight: 700; }
@font-face { font-family: "Noto Sans SC"; src: url(fonts/NotoSansSC-subset.woff2) format("woff2"); font-weight: 500 700; }
:root { --cream: #f4ecd8; --gold: #d4a94f; --gold2: #f6d98a; --pain: #e07a5f; --mute: #b8c8c1; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05121a; }
body { font-family: "Cairo", sans-serif; color: var(--cream); }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.a { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; }
.scn { position: absolute; inset: 0; }
.amiri { font-family: "Amiri", serif; font-weight: 700; }
.kufi { font-family: "Reem Kufi", sans-serif; font-weight: 700; }
.gold { color: var(--gold); }
.w { display: inline-block; }
.w.k { color: var(--gold); }
.chip { display: inline-block; border: 3px solid var(--gold); border-radius: 999px; padding: 4px 36px 12px; font-weight: 800; font-size: 50px;
  color: var(--cream); background: rgba(5, 18, 26, .62); }
svg { overflow: visible; display: block; }
.blob { position: absolute; border-radius: 50%; filter: blur(70px); }
#cap { position: absolute; left: 110px; right: 110px; bottom: 600px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
#cap .ar { font-weight: 800; font-size: 54px; line-height: 1.45; color: var(--cream); text-shadow: 0 2px 12px rgba(0,0,0,.7); }
#cap .zh { font-family: "Noto Sans SC", "Cairo", sans-serif; font-weight: 700; font-size: 42px; line-height: 1.4; color: #f3dca0; direction: ltr; text-shadow: 0 2px 12px rgba(0,0,0,.7); }
#cap .en { font-weight: 600; font-size: 35px; line-height: 1.35; color: var(--mute); direction: ltr; text-shadow: 0 2px 12px rgba(0,0,0,.7); }
</style>
</head>
<body>
<div id="stage">
  <div id="sky" class="layer" style="background: linear-gradient(180deg, #05121a 0%, #071c22 45%, #0b2e27 100%)"></div>
  <div id="b1" class="blob" style="left:0; top:0; width:900px; height:900px; background: rgba(17,96,76,.38)"></div>
  <div id="b2" class="blob" style="left:0; top:0; width:900px; height:900px; background: rgba(12,70,96,.32)"></div>
  <div id="b3" class="blob" style="left:0; top:0; width:700px; height:700px; background: rgba(17,96,76,.25)"></div>
  <div id="tintA" class="layer" style="background: radial-gradient(ellipse at 50% 38%, rgba(224,122,95,.6) 0%, rgba(224,122,95,.22) 40%, rgba(224,122,95,0) 72%); opacity:0"></div>
  <div id="tintG" class="layer" style="background: radial-gradient(ellipse at 50% 42%, rgba(246,217,138,.65) 0%, rgba(212,169,79,.24) 45%, rgba(212,169,79,0) 75%); opacity:0"></div>
  <canvas id="fx" class="layer" width="1080" height="1920"></canvas>

  <!-- the hero that stays: shield with the eye inside -->
  <svg id="shield" class="a" width="840" height="840" viewBox="-420 -420 840 840" aria-hidden="true"></svg>
  <svg id="eye" class="a" width="300" height="180" viewBox="-150 -90 300 180" aria-hidden="true">
    <defs><radialGradient id="pg"><stop offset="0" stop-color="#fff2d0"/><stop id="pg1" offset="0.55" stop-color="#e07a5f"/><stop offset="1" stop-color="#e07a5f" stop-opacity="0"/></radialGradient></defs>
    <path id="eyeA" d="M-140,0 C-85,-76 85,-76 140,0 C85,76 -85,76 -140,0 Z" fill="rgba(5,18,26,.55)" stroke="#d4a94f" stroke-width="8" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"/>
    <circle id="eyeI" r="40" fill="none" stroke="#d4a94f" stroke-width="6"/>
    <circle id="eyeP" r="22" fill="url(#pg)"/>
  </svg>

  <!-- SA: the threat -->
  <div id="SA" class="scn">
    <div id="t1" class="a amiri gold" style="font-size:230px; line-height:1.1">العينُ حق</div>
    <div id="t2" class="a" style="font-weight:900; font-size:84px; line-height:1.25; text-align:center"><div id="t2a"></div><div id="t2b"></div></div>
    <div id="seal" class="a" style="width:210px; height:210px">
      <svg width="210" height="210" viewBox="0 0 210 210" aria-hidden="true"><circle cx="105" cy="105" r="98" fill="rgba(5,18,26,.6)" stroke="#d4a94f" stroke-width="8"/><circle cx="105" cy="105" r="80" fill="none" stroke="#d4a94f" stroke-width="3" stroke-dasharray="3 8"/></svg>
      <div class="kufi gold" style="position:absolute; left:0; right:0; top:62px; text-align:center; font-size:52px; line-height:1.1">صحيح<br>مسلم</div>
    </div>
  </div>

  <!-- SB: the first two layers -->
  <div id="SB" class="scn">
    <div id="chipA" class="a"><span class="chip">أذكار الصباح والمساء</span></div>
    <svg id="sun" class="a" width="110" height="110" viewBox="-55 -55 110 110" aria-hidden="true"></svg>
    <svg id="moon" class="a" width="110" height="110" viewBox="-55 -55 110 110" aria-hidden="true"><path d="M14,-40 A42,42 0 1 0 14,40 A32,32 0 1 1 14,-40 Z" fill="#d4a94f"/></svg>
    <div id="chipB" class="a"><span class="chip">آية الكرسي والمعوّذات</span></div>
    <svg id="bookmini" class="a" width="130" height="100" viewBox="0 0 130 100" aria-hidden="true"></svg>
  </div>

  <!-- SC: for yourself and your child, the dua -->
  <div id="SC" class="scn">
    <svg class="a" style="left:0;top:0" width="1080" height="1920" viewBox="0 0 1080 1920" aria-hidden="true"><path id="arc1" d="M500,455 C430,500 340,545 300,598" fill="none" stroke="#d4a94f" stroke-width="5" stroke-dasharray="1" stroke-dashoffset="1" pathLength="1"/><path id="arc2" d="M580,455 C650,500 740,545 780,598" fill="none" stroke="#d4a94f" stroke-width="5" stroke-dasharray="1" stroke-dashoffset="1" pathLength="1"/></svg>
    <div id="cNafs" class="a"><span class="chip">نفسك</span></div>
    <div id="cWalad" class="a"><span class="chip">ولدك</span></div>
    <div id="cHasan" class="a"><span class="chip gold">الحسن</span></div>
    <div id="cHusayn" class="a"><span class="chip gold">الحسين</span></div>
    <div id="dua1" class="a amiri" style="font-size:90px; line-height:1.4; text-align:center"><div id="d1a"></div><div id="d1b"></div><div id="d1c"></div></div>
  </div>

  <!-- SD: when you admire something -->
  <div id="SD" class="scn">
    <div id="cMal" class="a"><span class="chip">مال</span></div>
    <div id="cWal2" class="a"><span class="chip">ولد</span></div>
    <div id="cNima" class="a"><span class="chip">نعمة</span></div>
    <div id="p1" class="a amiri gold" style="font-size:104px">مَا شَاءَ اللَّهُ</div>
    <div id="p2" class="a amiri gold" style="font-size:104px">تَبَارَكَ اللَّهُ</div>
    <div id="p3" class="a amiri gold" style="font-size:104px">اللَّهُمَّ بَارِكْ فِيهِ</div>
    <div id="waq" class="a amiri gold" style="font-size:210px; line-height:1.1">الوقاية</div>
  </div>

  <!-- SE1..3: if it strikes -->
  <div id="SE1" class="scn">
    <svg id="book" class="a" width="520" height="380" viewBox="0 0 680 470" aria-hidden="true"></svg>
    <div id="cFat" class="a"><span class="chip amiri" style="font-size:56px">الفاتحة</span></div>
    <div id="cMu" class="a"><span class="chip amiri" style="font-size:56px">المعوّذات</span></div>
  </div>
  <div id="SE2" class="scn">
    <div id="orb" class="a" style="width:420px; height:420px; border-radius:50%; background: radial-gradient(circle, #ffd0b0 0%, #f0956f 22%, rgba(224,122,95,.55) 48%, rgba(224,122,95,0) 72%)"></div>
    <div id="orbG" class="a" style="width:420px; height:420px; border-radius:50%; background: radial-gradient(circle, #fff1c4 0%, #f0cf7a 24%, rgba(212,169,79,.55) 50%, rgba(212,169,79,0) 72%)"></div>
    <svg id="hand" class="a" width="336" height="448" viewBox="0 0 240 320" aria-hidden="true"></svg>
    <div id="cMawdi" class="a"><span class="chip">موضع الألم</span></div>
    <div id="bsm" class="a amiri gold" style="font-size:112px; text-shadow:0 0 40px rgba(212,169,79,.5)">بِسْمِ اللَّهِ</div>
    <div id="ticks" class="a" style="display:flex; gap:40px"><span class="tk" id="k1"></span><span class="tk" id="k2"></span><span class="tk" id="k3"></span></div>
  </div>
  <div id="SE3" class="scn">
    <svg id="ring" class="a" width="270" height="270" viewBox="0 0 400 400" aria-hidden="true"></svg>
    <div id="x7" class="a kufi gold" style="font-size:84px; line-height:1">٧×</div>
    <div id="dua2" class="a amiri" style="font-size:80px; line-height:1.3; text-align:center"><div id="d2a"></div><div id="d2b"></div><div id="d2c"></div></div>
  </div>

  <!-- SF: and the doctor -->
  <div id="SF" class="scn">
    <svg id="cross" class="a" width="260" height="260" viewBox="0 0 240 240" aria-hidden="true">
      <circle cx="120" cy="120" r="110" fill="rgba(17,96,76,.6)" stroke="#d4a94f" stroke-width="8"/>
      <rect x="98" y="52" width="44" height="136" rx="12" fill="#f4ecd8"/><rect x="52" y="98" width="136" height="44" rx="12" fill="#f4ecd8"/>
    </svg>
    <div id="cTreat" class="a"><span class="chip">العلاج</span></div>
    <div id="cDoc" class="a"><span class="chip">الطبيب</span></div>
  </div>

  <!-- SG: share, save, the name -->
  <div id="SG" class="scn">
    <svg id="lamp" class="a" width="300" height="470" viewBox="0 0 300 470" aria-hidden="true">
      <defs><radialGradient id="lg"><stop offset="0" stop-color="#ffd98a" stop-opacity=".85"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient></defs>
      <circle id="lglow" cx="150" cy="300" r="150" fill="url(#lg)"/>
      <line x1="150" y1="0" x2="150" y2="170" stroke="#d4a94f" stroke-width="4"/>
      <path d="M108,170 L192,170 L176,198 L124,198 Z" fill="#d4a94f"/>
      <path d="M124,198 C70,230 70,330 112,372 L188,372 C230,330 230,230 176,198 Z" fill="none" stroke="#d4a94f" stroke-width="7"/>
      <path d="M150,236 C134,262 134,292 150,312 C166,292 166,262 150,236 Z" fill="#ffe3a3"/>
      <path d="M112,372 L188,372 L170,400 L130,400 Z" fill="#d4a94f"/>
      <line x1="150" y1="400" x2="150" y2="440" stroke="#d4a94f" stroke-width="4"/>
    </svg>
    <div id="name" class="a amiri gold" style="font-size:150px; line-height:1.2; text-shadow:0 0 50px rgba(212,169,79,.4)">في معيّة الله</div>
    <svg id="share" class="a" width="190" height="171" viewBox="0 0 240 216" aria-hidden="true">
      <path id="sh1" d="M30,100 L30,196 L210,196 L210,100" fill="none" stroke="#f4ecd8" stroke-width="12" stroke-linejoin="miter" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
      <path id="sh2" d="M120,150 L120,18" fill="none" stroke="#d4a94f" stroke-width="14" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
      <path id="sh3" d="M72,68 L120,16 L168,68" fill="none" stroke="#d4a94f" stroke-width="14" stroke-linejoin="miter" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    </svg>
    <svg id="bkm" class="a" width="150" height="190" viewBox="0 0 150 190" aria-hidden="true">
      <path id="bk1" d="M20,12 H130 V178 L75,136 L20,178 Z" fill="none" stroke="#d4a94f" stroke-width="12" stroke-linejoin="miter" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    </svg>
  </div>

  <div id="cap"><div class="ar" id="capAr"></div><div class="zh" id="capZh"></div><div class="en" id="capEn"></div></div>
  <canvas id="grain" class="layer" width="540" height="960" style="width:1080px; height:1920px"></canvas>
</div>
<style>.tk { width: 40px; height: 40px; border-radius: 50%; border: 5px solid #d4a94f; display: inline-block; background: transparent; }</style>

<script>
const W = 1080, H = 1920, CAPS = __CAPS__;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const EZ = { lin: (x) => x, out: (x) => 1 - Math.pow(1 - x, 3), in: (x) => x * x * x, io: (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  pop: (x) => { const c1 = 2.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); } };
function tw(t, k) {
  if (typeof k === "number") return k; if (typeof k === "function") return k(t);
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (t <= k[i][0]) { const [t0, v0] = k[i - 1], [t1, v1, e = "out"] = k[i]; return v0 + (v1 - v0) * EZ[e](clamp((t - t0) / ((t1 - t0) || 1))); }
  return k[k.length - 1][1];
}
const rng = (seed) => { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; };
const NS = "http://www.w3.org/2000/svg";
const mk = (tag, at, parent) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); parent && parent.appendChild(e); return e; };

// ---- registries ---------------------------------------------------------------------------
const ITEMS = [], DRAWS = [], WORDS = [], SCN = [], RIPS = [], BURSTS = [];
const A = (id, sp) => ITEMS.push([$(id), sp]);
const D = (el, k) => DRAWS.push([typeof el === "string" ? $(el) : el, k]);
const SC = (id, a, b, inMode = "blur") => SCN.push({ el: $(id), a, b, inMode });
const pop = (t, d = 0.45) => [[t - 0.001, 0], [t, 0.6], [t + d, 1, "pop"]];       // scale keys
const fade = (a, b, c, d) => [[a - 0.001, 0], [a, 0], [b, 1], [c, 1], [d, 0, "in"]]; // opacity keys: in at a..b, hold, out c..d
// spoken words of one chunk, spread by letter count
function spread(text, a, b) {
  const ws = text.split(/\s+/), cl = (w) => w.replace(/[ً-ْٰ]/g, ""), wt = ws.map((w) => cl(w).length + 0.6), tot = wt.reduce((p, c) => p + c, 0);
  let c = 0; return ws.map((w, i) => { const t = a + (b - a) * c / tot; c += wt[i]; return [w, t]; });
}
function mount(id, items, { mode = "blur", keys = [] } = {}) {
  const box = $(id);
  box.innerHTML = items.map(([w], i) => `<span class="w${keys.includes(i) ? " k" : ""}" data-i="${i}">${w}</span>`).join(" ");
  [...box.querySelectorAll(".w")].forEach((el, i) => WORDS.push({ el, t: items[i][1], mode, gold: keys.includes(i) }));
}

// ---- shared keys ----------------------------------------------------------------------------
const SX = 540;
const SY = [[0, 600], [7.1, 600], [7.8, 440, "io"], [13.9, 440], [14.6, 330, "io"], [27.4, 330], [28.0, 340, "io"], [37.6, 340], [38.2, 330, "io"], [51.1, 330], [51.8, 420, "io"], [55.6, 420]];
const SS = [[0, 1], [7.1, 1], [7.8, .62, "io"], [13.9, .62], [14.6, .40, "io"], [27.4, .40], [28.0, .44, "io"], [37.6, .44], [38.2, .40, "io"], [51.1, .40], [51.8, .55, "io"], [55.6, .55]];
const HERO_O = [[0, 1], [55.6, 1], [56.2, 0, "in"]];
const eyeScale = (t) => t < 5.2 ? tw(t, [[4.3, 2.4], [5.2, 1, "io"]]) : tw(t, SS);
const eyeY = (t) => t < 5.2 ? 600 : tw(t, SY);

// ---- hero: shield + rings + eye -------------------------------------------------------------
const shp = (s) => `M0,${-280 * s} L${225 * s},${-215 * s} L${225 * s},${10 * s} C${225 * s},${140 * s} ${125 * s},${210 * s} 0,${280 * s} C${-125 * s},${210 * s} ${-225 * s},${140 * s} ${-225 * s},${10 * s} L${-225 * s},${-215 * s} Z`;
const shield = $("shield");
const SHF = mk("path", { d: shp(1), fill: "rgba(5,18,26,.55)", opacity: 0 }, shield);
const SH = mk("path", { d: shp(1), fill: "none", stroke: "#d4a94f", "stroke-width": 12, "stroke-linejoin": "round", pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1 }, shield);
const RING = [[1.17, 8.3, "#d4a94f", .85], [1.34, 11.2, "#d4a94f", .7], [1.51, 21.3, "#f6d98a", .55], [1.69, 31.5, "#f6d98a", .42]].map(([s, t, c, o]) => {
  const p = mk("path", { d: shp(s), fill: "none", stroke: c, "stroke-width": 6, "stroke-linejoin": "round", "stroke-opacity": o, pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1 }, shield);
  D(p, [[t, 1], [t + 0.7, 0, "io"]]); return p; });
D(SH, [[5.3, 1], [6.4, 0, "io"]]);
const FILLK = [[5.8, 0], [6.6, 1]];
A("shield", { x: SX, y: SY, s: SS, o: HERO_O });
A("eye", { x: SX, y: eyeY, s: eyeScale, o: HERO_O });
const eyeP = $("eyeP"), eyeI = $("eyeI"), pg1 = $("pg1");
const BEATS = [0.3, 1.1, 1.9, 2.7, 3.5, 38.3, 39.1, 39.9, 40.7, 41.5, 42.3];
const pulse = (t) => BEATS.reduce((m, b) => t >= b ? Math.max(m, Math.max(0, 1 - (t - b) / 0.4)) : m, 0);
const lerpC = (a, b, p) => a.map((v, i) => Math.round(v + (b[i] - v) * clamp(p)));
function pupilColor(t) { // amber while threatened or afflicted, gold when protected
  const amber = [224, 122, 95], gold = [246, 217, 138];
  const p = Math.max(tw(t, [[5.4, 0], [6.4, 1]]) * (1 - tw(t, [[37.7, 0], [38.4, 1]])), tw(t, [[44.6, 0], [45.4, 1]]));
  return lerpC(amber, gold, p);
}

// ---- SA: the threat ---------------------------------------------------------------------------
SC("SA", 0, 7.3);
A("t1", { x: SX, y: 250, s: [[0, 1.1], [0.55, 1, "out"]], o: [[0, 1], [4.1, 1], [4.4, 0, "in"]], b: [[4.1, 0], [4.4, 10]] });
const C2 = spread("فكيف نتحصّن من العين والحسد؟", 4.39, 7.08);
mount("t2a", C2.slice(0, 2)); mount("t2b", C2.slice(2));
A("t2", { x: SX, y: 235, o: [[4.38, 1], [7.0, 1], [7.3, 0, "in"]] });
const C1 = spread("كما قال النبي صلى الله عليه وسلم في صحيح مسلم", 1.17, 4.07), tSeal = C1[8][1];
A("seal", { x: 880, y: 770, s: [[tSeal - 0.09, 2.0], [tSeal + 0.2, 0.7, "in"]], r: -11, o: [[tSeal - 0.09, 0], [tSeal - 0.07, 1], [4.2, 1], [4.5, 0, "in"]] });

// ---- SB: layers one and two -------------------------------------------------------------------
SC("SB", 7.1, 13.8);
const C3 = spread("ابدأ بالمحافظة على أذكار الصباح والمساء", 8.09, 10.64), C4 = spread("وقراءة آية الكرسي والمعوذات", 11.0, 13.16);
A("chipA", { x: SX, y: 800, s: pop(C3[0][1]), o: [[C3[0][1] - 0.001, 0], [C3[0][1], 1]] });
A("chipB", { x: SX, y: 925, s: pop(C4[0][1]), o: [[C4[0][1] - 0.001, 0], [C4[0][1], 1]] });
{ const sun = $("sun"); mk("circle", { r: 24, fill: "#d4a94f" }, sun);
  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; mk("line", { x1: Math.cos(a) * 34, y1: Math.sin(a) * 34, x2: Math.cos(a) * 50, y2: Math.sin(a) * 50, stroke: "#d4a94f", "stroke-width": 6, "stroke-linecap": "round" }, sun); } }
A("sun", { x: 130, y: 800, s: pop(C3[4][1]), r: [[C3[4][1], 0], [13.8, 90, "lin"]], o: [[C3[4][1] - 0.001, 0], [C3[4][1], 1]] });
A("moon", { x: 950, y: 800, s: pop(C3[5][1]), o: [[C3[5][1] - 0.001, 0], [C3[5][1], 1]] });
