 "and it is not for you to do the same with every sick person.", "zh": "你不应对每一个病人都这样做。"}, {"a": 35.24, "b": 38.6, "ar": "فكثيرٌ من الأطفال مرضُه عضويٌّ أو نفسيّ", "en": "For many children, the illness is physical or psychological.", "zh": "因为许多孩子的病是身体上的或心理上的。"}, {"a": 38.6, "b": 41.29, "ar": "فإذا مرض طفلك فعوِّذه بالقرآن والأذكار", "en": "So if your child falls ill, protect him with the Qur’an and the adhkar,", "zh": "所以,如果你的孩子生病了,用《古兰经》和祈祷词为他祈求庇护,"}, {"a": 41.66, "b": 43.37, "ar": "واذهب به إلى الطبيب فورًا", "en": "and take him to the doctor right away.", "zh": "并立即带他去看医生。"}, {"a": 44.13, "b": 47.0, "ar": "شارك هذه القصة مع من تحب، وتابع القناة", "en": "Share this story with someone you love, and follow the channel.", "zh": "把这个故事分享给你爱的人,并关注本频道。"}];
