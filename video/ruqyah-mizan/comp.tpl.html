<script>

const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const EZ = { lin: (x) => x, out: (x) => 1 - Math.pow(1 - x, 3), in: (x) => x * x * x, io: (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  pop: (x) => { const c1 = 2.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); } };
function tw(t, k) {
  if (typeof k === "number") return k; if (typeof k === "function") return k(t);

const D = (el, k) => DRAWS.push([typeof el === "string" ? $(el) : el, k]);
const SC = (id, a, b) => SCN.push({ el: $(id), a, b });
const pop = (t, d = 0.4) => [[t - 0.001, 0.6], [t + d, 1, "pop"]];
const inc = (t0, t1, k = "out") => [[t0, 1], [t1, 0, k]];
const on = (a, b, d = 0.2) => [[a - 0.001, 0], [a, 1], [b, 1], [b + d, 0, "in"]];
function spiral(id, turns, r) { let d = ""; for (let i = 0; i <= 60; i++) { const a = i / 60 * turns * Math.PI * 2, rr = r * (0.18 + 0.82 * i / 60); d += (i ? " L" : "M") + (rr * Math.cos(a)).toFixed(1) + "," + (rr * Math.sin(a)).toFixed(1); } $(id).setAttribute("d", d); }
function star(id, r, ri) { const pts = []; for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8 - Math.PI / 2, q = i % 2 ? ri : r; pts.push(`${(q * Math.cos(a)).toFixed(1)},${(q * Math.sin(a)).toFixed(1)}`); } $(id).setAttribute("points", pts.join(" ")); }

function spread(text, a, b) {
  const ws = text.split(/\s+/), cl = (w) => w.replace(/[ً-ْٰ]/g, ""), wt = ws.map((w) => cl(w).length + 0.6), tot = wt.reduce((p, c) => p + c, 0);
  let c = 0; return ws.map((w, i) => { const t = a + (b - a) * c / tot; c += wt[i]; return [w, t]; });
}
// background pattern: 8-point stars
for (const [svg, w, h] of [[$("pat"), 1080, 960], [$("pat2"), 1080, 960]]) { const col = svg === $("pat") ? "#7a2848" : "#ffffff"; for (let y = 0; y < h + 120; y += 120) for (let x = 0; x < w + 120; x += 120) { const o = (y / 120) % 2 ? 60 : 0;
  mk("rect", { x: x + o - 34, y: y - 34, width: 68, height: 68, fill: "none", stroke: col, "stroke-width": 3 }, svg); mk("rect", { x: x + o - 34, y: y - 34, width: 68, height: 68, fill: "none", stroke: col, "stroke-width": 3, transform: `rotate(45 ${x + o} ${y})` }, svg); } }
function book(svg, w, h) { const r = rng(11), cx = w / 2; mk("path", { d: `M${cx},${h * .08} L${w * .02},${h * .02} L${w * .02},${h * .94} L${cx},${h} L${w * .98},${h * .94} L${w * .98},${h * .02} Z`, fill: "#cdeedd", stroke: "#2a9d8f", "stroke-width": 14, "stroke-linejoin": "round" }, svg);
  mk("line", { x1: cx, y1: h * .06, x2: cx, y2: h * .97, stroke: "#2a9d8f", "stroke-width": 10 }, svg);

const T = {"ink": "#5a1f37", "fill": "#fff6ef", "gold": "#f2b134", "gold2": "#d98e04", "red": "#d6455d", "green": "#1f9d84", "blue": "#3b7fb6", "violet": "#8a63c9", "book": "#7a2848", "bookText": "#fff6ef", "pink": "#d6455d", "cyan": "#3b7fb6"};
// ---- themed builder kit ----------------------------------------------------------------------------------------------
const box = (w, h, vb, parent) => mk("svg", { width: w, height: h, viewBox: vb, class: "a" }, parent);
const INK = T.ink;
function chipEl(parent, txt, cls = "", size = 54, amiri = true) { const d = document.createElement("div"); d.className = "a"; const s = document.createElement("span"); s.className = "chip " + cls; s.style.fontSize = size + "px"; if (amiri) { s.style.fontFamily = "Amiri"; s.style.fontWeight = 700; } s.textContent = txt; d.appendChild(s); parent.appendChild(d); return d; }
function textEl(parent, txt, size, color, amiri = true) { const d = document.createElement("div"); d.className = "a" + (amiri ? " amiri" : ""); d.style.cssText = `font-size:${size}px; line-height:1.2; color:${color}; ${amiri ? "" : "font-weight:800;"}`; d.textContent = txt; parent.appendChild(d); return d; }
function sunEl(p) { const s = box(220, 220, "-110 -110 220 220", p); for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; mk("line", { x1: Math.cos(a) * 70, y1: Math.sin(a) * 70, x2: Math.cos(a) * 100, y2: Math.sin(a) * 100, stroke: T.gold2, "stroke-width": 9, "stroke-linecap": "round" }, s); } mk("circle", { r: 56, fill: T.gold, stroke: T.gold2, "stroke-width": 7 }, s); return s; }
function moonEl(p) { const s = box(220, 220, "-110 -110 220 220", p); mk("path", { d: "M30,-90 A92,92 0 1 0 30,90 A72,72 0 1 1 30,-90 Z", fill: T.fill, stroke: T.violet, "stroke-width": 7, "stroke-linejoin": "round" }, s); return s; }
function shieldEl(p) { const s = box(330, 380, "0 0 330 380", p); mk("path", { d: "M165,14 C120,44 70,50 22,50 V190 C22,280 90,336 165,368 C240,336 308,280 308,190 V50 C260,50 210,44 165,14 Z", fill: T.gold + "55", stroke: T.gold2, "stroke-width": 14, "stroke-linejoin": "round" }, s); return s; }
function eyeEl(p) { const s = box(200, 130, "0 0 200 130", p); mk("path", { d: "M10,65 Q100,-15 190,65 Q100,145 10,65 Z", fill: T.fill, stroke: T.ink, "stroke-width": 8, "stroke-linejoin": "round" }, s); mk("circle", { cx: 100, cy: 65, r: 30, fill: T.violet, stroke: T.ink, "stroke-width": 6 }, s); mk("circle", { cx: 100, cy: 65, r: 12, fill: T.ink }, s); return s; }
function scrollEl(p, w = 200, dashed = false) { const s = box(w, w * 1.1, "0 0 200 220", p); mk("rect", { x: 20, y: 14, width: 160, height: 192, rx: 20, fill: T.fill, stroke: T.gold2, "stroke-width": 9, "stroke-dasharray": dashed ? "16 12" : "none" }, s); for (let i = 0; i < 5; i++) mk("line", { x1: 46, y1: 52 + i * 34, x2: 154 - (i % 2) * 30, y2: 52 + i * 34, stroke: T.ink, "stroke-width": 8, "stroke-linecap": "round", opacity: .75 }, s); return s; }
function tickEl(p, w = 200) { const s = box(w, w, "0 0 100 100", p); const t = mk("path", { d: "M18,54 L42,78 L86,24", fill: "none", stroke: T.green, "stroke-width": 13, "stroke-linecap": "round", "stroke-linejoin": "round", pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1 }, s); return [s, t]; }
function crossEl(p, w = 220, col) { col = col || T.red; const s = box(w, w, "0 0 100 100", p); const a = mk("path", { d: "M14,14 L86,86", stroke: col, "stroke-width": 11, "stroke-linecap": "round", pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1 }, s), b = mk("path", { d: "M86,14 L14,86", stroke: col, "stroke-width": 11, "stroke-linecap": "round", pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1 }, s); return [s, a, b]; }
function arrowEl(p, x1, y1, x2, y2, col) { col = col || T.gold2; const s = mk("svg", { width: 1080, height: 1920, viewBox: "0 0 1080 1920", class: "layer" }, p); const a = Math.atan2(y2 - y1, x2 - x1), h = 46, d = `M${x1},${y1} L${x2},${y2} M${x2 - h * Math.cos(a - .5)},${y2 - h * Math.sin(a - .5)} L${x2},${y2} L${x2 - h * Math.cos(a + .5)},${y2 - h * Math.sin(a + .5)}`; return mk("path", { d, fill: "none", stroke: col, "stroke-width": 12, "stroke-linecap": "round", "stroke-linejoin": "round", pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1 }, s); }
function cupEl(p) { const s = box(180, 220, "0 0 180 220", p); mk("path", { d: "M26,30 H154 L138,196 Q137,208 125,208 H55 Q43,208 42,196 Z", fill: T.fill, stroke: T.ink, "stroke-width": 8, "stroke-linejoin": "round" }, s); mk("path", { d: "M34,92 Q62,76 90,92 T146,92 L138,196 Q137,208 125,208 H55 Q43,208 42,196 Z", fill: T.blue, stroke: T.ink, "stroke-width": 6, "stroke-linejoin": "round" }, s); return s; }
function mushEl(p, w = 300) { const s = box(w, w * 0.69, "0 0 680 470", p); const r = rng(11), cx = 340, wd = 680, h = 470; mk("path", { d: `M${cx},${h * .08} L${wd * .02},${h * .02} L${wd * .02},${h * .94} L${cx},${h} L${wd * .98},${h * .94} L${wd * .98},${h * .02} Z`, fill: T.fill, stroke: T.gold2, "stroke-width": 14, "stroke-linejoin": "round" }, s); mk("line", { x1: cx, y1: h * .06, x2: cx, y2: h * .97, stroke: T.gold2, "stroke-width": 10 }, s);
  for (const side of [-1, 1]) for (let i = 0; i < 6; i++) { const y = h * (.2 + i * .1), x0 = side < 0 ? wd * .08 : cx + wd * .06; mk("line", { x1: x0, y1: y, x2: x0 + wd * (.3 + r() * .1), y2: y, stroke: T.ink, "stroke-width": 9, "stroke-linecap": "round", opacity: .75 }, s); } return s; }
function medEl(p, w = 220) { const s = box(w, w, "0 0 240 240", p); mk("circle", { cx: 120, cy: 120, r: 108, fill: T.fill, stroke: T.red, "stroke-width": 9 }, s); mk("path", { d: "M98,52 H142 V98 H188 V142 H142 V188 H98 V142 H52 V98 H98 Z", fill: T.red, stroke: T.red, "stroke-width": 6, "stroke-linejoin": "round" }, s); return s; }
function pillEl(p, w = 220) { const s = box(w, w, "0 0 240 240", p); const g = mk("g", { transform: "rotate(-40 120 120)" }, s); mk("rect", { x: 30, y: 78, width: 180, height: 84, rx: 42, fill: T.fill, stroke: T.ink, "stroke-width": 8 }, g); mk("path", { d: "M120,78 H72 A42,42 0 0 0 72,162 H120 Z", fill: T.gold, stroke: T.ink, "stroke-width": 8, "stroke-linejoin": "round" }, g); return s; }
function circleTick(p, d = 230) { const s = box(d, d, "0 0 100 100", p); mk("circle", { cx: 50, cy: 50, r: 46, fill: T.green + "33", stroke: T.green, "stroke-width": 6 }, s); const t = mk("path", { d: "M26,52 L44,70 L76,32", fill: "none", stroke: T.green, "stroke-width": 10, "stroke-linecap": "round", "stroke-linejoin": "round", pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1 }, s); return [s, t]; }
const star16 = (r, ri) => { const pts = []; for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8 - Math.PI / 2, q = i % 2 ? ri : r; pts.push(`${(q * Math.cos(a)).toFixed(1)},${(q * Math.sin(a)).toFixed(1)}`); } return pts.join(" "); };
function sealEl(p, txt = "ﷺ") { const s = box(260, 260, "-130 -130 260 260", p); mk("polygon", { fill: T.gold, stroke: T.ink, "stroke-width": 7, "stroke-linejoin": "round", points: star16(122, 90) }, s); mk("circle", { r: 66, fill: T.fill, stroke: T.ink, "stroke-width": 5 }, s); const tx = mk("text", { x: 0, y: 26, "text-anchor": "middle", "font-family": "Amiri", "font-weight": 700, "font-size": 76, fill: T.ink }, s); tx.textContent = txt; return s; }
function bookEl(p, label) { const s = box(300, 380, "0 0 330 420", p); mk("rect", { x: 22, y: 14, width: 296, height: 392, rx: 22, fill: T.book, stroke: T.gold2, "stroke-width": 10 }, s); mk("path", { d: "M54,14 V406", stroke: T.gold2, "stroke-width": 6 }, s); const lines = label.split("|"); lines.forEach((l, i) => { const t = mk("text", { x: 188, y: 190 + i * 86 - (lines.length - 1) * 30, "text-anchor": "middle", "font-family": "Amiri", "font-weight": 700, "font-size": 74, fill: T.bookText }, s); t.textContent = l; }); return s; }
function bubbleEl(p, txt, size = 76, color) { const d = document.createElement("div"); d.className = "a"; d.innerHTML = `<div class="bub mid" style="font-size:${size}px; ${color ? "color:" + color : ""}">${txt}</div>`; p.appendChild(d); return d; }
function cardEl(p, w, h) { const d = document.createElement("div"); d.className = "a"; d.style.cssText = `width:${w}px; height:${h}px; background:${T.fill}; border:9px solid ${T.gold2}; border-radius:44px; box-shadow:0 14px 0 rgba(0,0,0,.18)`; p.appendChild(d); return d; }
const seg = (a, b, d = .25) => [[a - 0.001, 0], [a, 1], [b, 1], [b + d, 0, "in"]];
const SS = (el, t, to, d = .25, extra = {}) => A(el, Object.assign({ s: pop(t), o: seg(t, to, d) }, extra));
const X = (S, x, y, t, to, w = 240) => { const [xs, xa, xb] = crossEl(S, w); A(xs, { x, y, o: seg(t, to, .2) }); D(xa, inc(t, t + 0.25)); D(xb, inc(t + 0.12, t + 0.37)); BURSTS.push({ t: t + 0.4, x, y }); };
const TICK = (S, x, y, t, to, w = 170) => { const [ts, tt] = tickEl(S, w); A(ts, { x, y, o: seg(t, to, .2) }); D(tt, inc(t, t + 0.4)); BURSTS.push({ t: t + 0.4, x, y }); };
