html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1b2a2e; }
body { font-family: "Cairo", sans-serif; color: var(--chalk); }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.a { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; }
.scn { position: absolute; inset: 0; }
.amiri { font-family: "Amiri", serif; font-weight: 700; }
.kufi { font-family: "Reem Kufi", sans-serif; font-weight: 700; }
.ct { filter: url(#chalkT); }
.cl { filter: url(#chalkL); }
.chip { display: inline-block; border: 5px solid var(--chalk); border-radius: 22px; padding: 2px 34px 10px; font-weight: 800; font-size: 54px; color: var(--chalk); background: rgba(27,42,46,.55); }
.chip.y { border-color: var(--yel); color: var(--yel); } .chip.c { border-color: var(--cor); color: var(--cor); } .chip.m { border-color: var(--mint); color: var(--mint); } .chip.b { border-color: var(--blue); color: var(--blue); }
svg { overflow: visible; display: block; }
#cap { position: absolute; left: 110px; right: 110px; top: 1002px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
#cap .ar { font-weight: 800; font-size: 54px; line-height: 1.45; color: #fbfbf4; text-shadow: 0 2px 10px rgba(10,5,0,.9); }
#cap .zh { font-family: "Noto Sans SC", "Cairo", sans-serif; font-weight: 700; font-size: 42px; line-height: 1.4; color: #ffdf6a; direction: ltr; text-shadow: 0 2px 10px rgba(10,5,0,.9); }
#cap .en { font-weight: 600; font-size: 35px; line-height: 1.35; color: #d7ddd0; direction: ltr; text-shadow: 0 2px 10px rgba(10,5,0,.9); }
</style>

 in this matter is the middle way:", "zh": "此事的真相在于中道:"}, {"a": 35.9, "b": 38.75, "ar": "لا إنكار للمسّ الثابت بالنص، ولا مبالغة فيه", "en": "no denial of possession that is established by the text, and no exaggeration of it,", "zh": "既不否认经文所确证的附体,也不夸大它,"}, {"a": 39.03, "b": 41.3, "ar": "والجمع بين الرقية الشرعية والطبيب", "en": "and combining sharʿī ruqyah with the doctor.", "zh": "并将合乎教法的诵经祛病与医生治疗结合起来。"}, {"a": 41.45, "b": 44.32, "ar": "شارك هذا المقطع مع من تحب، وتابع القناة", "en": "Share this clip with someone you love, and follow the channel.", "zh": "把这段视频分享给你爱的人,并关注本频道。"}];
