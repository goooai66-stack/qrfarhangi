<!doctype html>
<html lang="ar" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
    @font-face { font-family: "Cairo"; src: url("assets/fonts/Cairo.ttf") format("truetype"); font-weight: 200 1000; }
    @font-face { font-family: "Reem Kufi"; src: url("assets/fonts/ReemKufi.ttf") format("truetype"); font-weight: 400 700; }
    @font-face { font-family: "Amiri"; src: url("assets/fonts/Amiri-Regular.woff") format("woff"); font-weight: 400; }
    @font-face { font-family: "Amiri"; src: url("assets/fonts/Amiri-Bold.woff") format("woff"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #05121a; }
      body { font-family: "Cairo", sans-serif; }
      #sky { position: absolute; inset: 0; background: linear-gradient(180deg, #05121a 0%, #071c22 45%, #0b2e27 100%); }
      #dawn { position: absolute; inset: 0; opacity: 0;
        background: linear-gradient(180deg, rgba(29, 58, 58, 0) 0%, rgba(29, 58, 58, .55) 50%, rgba(122, 90, 46, .75) 100%); }
      #prog-in { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; align-items: center;
        gap: 18px; direction: rtl; opacity: 0; }
      #prog-in .dot { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; border: 3px solid #d4a94f;
        color: #d4a94f; font-family: "Reem Kufi", sans-serif; font-weight: 700; font-size: 34px; opacity: .45; }
      #prog-in .bar { width: 40px; height: 3px; background: #d4a94f; opacity: .35; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="39.5" data-width="1080" data-height="1920">
      <div id="sky"></div>
      <div id="dawn"></div>
      <div id="stars" data-composition-id="starfield" data-composition-src="compositions/starfield.html" data-start="0"
        data-duration="39.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"
        data-variable-values='{"density":"sparse","tone":"warm","speed":"slow"}' style="z-index: 2"></div>
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="6.25" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="5.95" data-duration="7.75" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 4"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="13.4" data-duration="6.35" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="19.25" data-duration="12.60" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5.html" data-start="31.55" data-duration="7.95" data-track-index="6" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 7"></div>
      <div id="prog" class="clip" data-start="6.0" data-duration="25.85" data-track-index="8" style="z-index: 9">
        <div id="prog-in">
          <div class="dot" id="pd1">١</div><div class="bar"></div><div class="dot" id="pd2">٢</div><div class="bar"></div><div class="dot" id="pd3">٣</div>
        </div>
      </div>
      <div id="caps" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0"
        data-duration="39.5" data-track-index="9" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="grain-overlay" style="position: absolute; inset: 0; pointer-events: none; z-index: 100; overflow: hidden">
        <div class="grain-texture"></div>
      </div>
      <audio id="a-voice" src="assets/voice.mp3" data-start="0" data-duration="37.96" data-track-index="19" data-volume="1"></audio>
      <audio id="sfx-whip" src="assets/sfx/whoosh-a.wav" data-start="5.93" data-track-index="20" data-volume="0.45"></audio>
      <audio id="sfx-pop1" src="assets/sfx/pop-a.wav" data-start="6.36" data-track-index="21" data-volume="0.45"></audio>
      <audio id="sfx-pop2" src="assets/sfx/pop-b.wav" data-start="13.98" data-track-index="22" data-volume="0.45"></audio>
      <audio id="sfx-grow" src="assets/sfx/whoosh-b.wav" data-start="19.02" data-track-index="23" data-volume="0.45"></audio>
      <audio id="sfx-pop3" src="assets/sfx/pop-a.wav" data-start="19.83" data-track-index="24" data-volume="0.45"></audio>
      <audio id="sfx-c1" src="assets/sfx/pop-b.wav" data-start="24.0" data-track-index="25" data-volume="0.45"></audio>
      <audio id="sfx-c2" src="assets/sfx/pop-a.wav" data-start="25.02" data-track-index="26" data-volume="0.45"></audio>
      <audio id="sfx-c3" src="assets/sfx/pop-b.wav" data-start="25.53" data-track-index="27" data-volume="0.45"></audio>
    </div>
    <style>
      @keyframes hf-grain-noise {
        0%, 100% { transform: translate(0, 0); } 10% { transform: translate(-5%, -5%); } 20% { transform: translate(-10%, 5%); }
        30% { transform: translate(5%, -10%); } 40% { transform: translate(-5%, 15%); } 50% { transform: translate(-10%, 5%); }
        60% { transform: translate(15%, 0); } 70% { transform: translate(0, 10%); } 80% { transform: translate(-15%, 0); }
        90% { transform: translate(10%, 5%); }
      }
      #grain-overlay .grain-texture { position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; opacity: 0.06;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        animation: hf-grain-noise 0.5s steps(1) infinite; }
    </style>
    <script>
      const tl = gsap.timeline({ paused: true });
      // حتى يُصبح: the sky floods toward dawn, then back to night for the next verse
      tl.to("#dawn", { opacity: 1, duration: 0.7, ease: "power2.inOut" }, 12.35);
      tl.to("#dawn", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 13.45);
      // progress ١ ٢ ٣ through the three steps
      tl.fromTo("#prog-in", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 6.0);
      [["#pd1", 6.1], ["#pd2", 13.75], ["#pd3", 19.6]].forEach(([d, t], i, all) => {
        tl.to(d, { opacity: 1, scale: 1.15, backgroundColor: "#d4a94f", color: "#05121a", duration: 0.3, ease: "back.out(1.4)" }, t);
        if (i < all.length - 1) tl.to(d, { scale: 0.92, backgroundColor: "rgba(5,18,26,0)", color: "#d4a94f", duration: 0.3 }, all[i + 1][1]);
      });
      tl.to("#prog-in", { opacity: 0, duration: 0.3, ease: "power2.in" }, 31.5);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
