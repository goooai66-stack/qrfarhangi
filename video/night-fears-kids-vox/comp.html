html, body { margin: 0; background: #efe6d2; overflow: hidden; }

  background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 60%, rgba(120,80,30,.22) 100%), radial-gradient(ellipse at 22% 14%, rgba(255,255,255,.55), rgba(255,255,255,0) 45%), #efe6d2; }
#grain { position: absolute; inset: 0; opacity: .5; mix-blend-mode: multiply; }

.a { position: absolute; }
.sal { font-family: "Amiri", serif; }
.shadow { filter: drop-shadow(4px 7px 0 rgba(29,26,22,.22)); }
.chipwrap { position: absolute; right: 60px; display: flex; flex-direction: row; direction: rtl; align-items: center; gap: 16px; }
.chip { display: inline-block; padding: 15px 38px 17px; font-weight: 800; line-height: 1.25; direction: rtl; white-space: nowrap; }

.qin { position: absolute; inset: 14px; border: 3px dashed rgba(29,26,22,.55); pointer-events: none; }
.sec { position: absolute; display: none; }

#capbox { background: #fbf5e6; padding: 20px 44px 20px; box-sizing: border-box; text-align: center; }
#capAr { font-family: "Cairo", sans-serif; font-weight: 700; color: #1d1a16; direction: rtl; line-height: 1.55; }
#capEn { font-family: "Cairo", sans-serif; font-weight: 500; color: #6b5a45; direction: ltr; line-height: 1.35; margin-top: 4px; }
#capZh { font-family: "Noto Sans SC", "WenQuanYi Zen Hei", sans-serif; font-weight: 500; color: #a8372b; direction: ltr; line-height: 1.35; margin-top: 2px; }
#bar { position: absolute; left: 0; top: 0; height: 7px; background: #e0624f; }
</style></head><body><div id="stage">
<svg id="grain" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg"><filter id="nf"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .36  0 0 0 0 .25  0 0 0 .22 0"/></filter><rect width="1920" height="1080" filter="url(#nf)"/></svg>

<script>
const W = 1920, H = 1080, DUR = 395.6, CAPS = [{"a": 0.03, "b": 4.03, "ar": "في هدأة الليل، يرتفع صراخٌ من غرفة الصغار.", "en": "In the stillness of the night, a scream rises from the children’s room.", "zh": "夜深人静时,孩子们的房间里传出一声尖叫。"}, {"a": 4.12, "b": 8.38, "ar": "تهرع الأم فتجد طفلها جالسًا في فراشه يرتجف،", "en": "The mother rushes in and finds her child sitting up in bed, trembling,", "zh": "母亲急忙跑去,发现孩子坐在床上发抖,"}, {"a": 8.47, "b": 12.1, "ar": "ويشير إلى زاوية الغرفة: هناك شيء!", "en": "pointing to the corner of the room: “There’s something there!”", "zh": "指着房间的角落:“那里有东西!”"}, {"a": 12.19, "b": 14.23, "ar": "تضمّه وتهدّئه،", "en": "She hugs him and calms him,", "zh": "她抱住他,安抚他,"}, {"a": 14.32, "b": 18.53, "ar": "ثم تتكرر القصة في الليلة التالية، والتي بعدها.", "en": "then the story repeats the next night, and the one after.", "zh": "可第二天晚上、第三天晚上,同样的事又发生了。"}, {"a": 18.62, "b": 22.59, "ar": "طفلٌ كان ينام قرير العين، صار يخاف الظلام،", "en": "A child who used to sleep soundly now fears the dark,", "zh": "一个原本睡得安稳的孩子,变得害怕黑暗,"}, {"a": 22.68, "b": 26.64, "ar": "ولا يقبل أن يبقى وحده، ويستيقظ مرات في الليل.", "en": "won’t stay alone, and wakes several times a night.", "zh": "不肯独处,夜里醒来好几次。"}, {"a": 26.73, "b": 30.55, "ar": "إن كانت هذه لياليكم، فهذه الحلقة لكم.", "en": "If these are your nights, this episode is for you.", "zh": "如果这就是你们的夜晚,那么这一期就是为你们准备的。"}, {"a": 30.64, "b": 35.38, "ar": "سنمشي معًا مع هدي النبي ﷺ في ليل الأطفال،", "en": "Together we will walk with the Prophet’s guidance (peace be upon him) through a child’s night,", "zh": "我们将一起跟随先知(愿主福安之)的指引,走过孩子的夜晚,"}, {"a": 35.47, "b": 43.39, "ar": "من غروب الشمس، إلى لحظة النوم، إلى اللحظة التي يستيقظ فيها الصغير مذعورًا من حلمٍ مخيف.", "en": "from sunset, to the moment of sleep, to the moment the little one wakes terrified from a bad dream.", "zh": "从日落,到入睡,再到孩子从噩梦中惊醒的那一刻。"}, {"a": 43.48, "b": 45.9, "ar": "نبدأ من ساعة الغروب.", "en": "We begin at the hour of sunset.", "zh": "我们从日落时分开始。"}, {"a": 45.99, "b": 52.19, "ar": "قال رسول الله ﷺ: «إذا كان جُنحُ الليل فكُفّوا صبيانكم،", "en": "The Messenger of Allah (peace be upon him) said: “When night falls, keep your children in,", "zh": "真主的使者(愿主福安之)说:“当夜幕降临时,把你们的孩子留在家里,"}, {"a": 52.28, "b": 57.84, "ar": "فإن الشياطين تنتشر حينئذ، فإذا ذهب ساعةٌ من الليل فخلّوهم،", "en": "for the devils spread out at that time; when an hour of the night has passed, let them go,", "zh": "因为那时恶魔四处散开;过了一段时间,再放他们出去,"}, {"a": 57.93, "b": 63.32, "ar": "وأغلقوا الأبواب واذكروا اسم الله، فإن الشيطان لا يفتح بابًا مغلقًا».", "en": "and close the doors and mention Allah’s name, for the devil does not open a closed door.”", "zh": "关门时要念真主之名,因为恶魔打不开关着的门。”"}, {"a": 63.41, "b": 65.61, "ar": "لاحظوا دقّة هذا التوجيه:", "en": "Notice how precise this guidance is:", "zh": "请注意这个指引是多么细致:"}, {"a": 65.7, "b": 68.03, "ar": "لم يأمرنا أن نخاف من الظلام،", "en": "he did not tell us to fear the dark,", "zh": "他没有让我们害怕黑暗,"}, {"a": 68.12, "b": 74.03, "ar": "بل أن نُبقي أطفالنا قريبين منا في تلك الساعة، وأن نغلق بيوتنا باسم الله.", "en": "but to keep our children close at that hour, and to close our homes with the name of Allah.", "zh": "而是让我们在那个时刻把孩子留在身边,并奉真主之名关好家门。"}, {"a": 74.12, "b": 76.96, "ar": "فعند المغرب أدخلوا الصغار إلى البيت،", "en": "So at maghrib, bring the little ones inside,", "zh": "所以在昏礼时分,把孩子们带回家里,"}, {"a": 77.05, "b": 80.58, "ar": "وكلما أغلقتَ بابًا فقل: بسم الله.", "en": "and whenever you close a door, say: “Bismillah.”", "zh": "每关一扇门,就念:“奉真主之名。”"}, {"a": 80.67, "b": 83.86, "ar": "ثم.. بيتٌ لا مبيت فيه للشيطان.", "en": "Then... a home where the devil finds no place to spend the night.", "zh": "接着……一个恶魔无处过夜的家。"}, {"a": 83.95, "b": 91.55, "ar": "أخبر النبي ﷺ أن الرجل إذا دخل بيته فذكر الله عند دخوله وعند طعامه،", "en": "The Prophet (peace be upon him) told us that when a man enters his home and mentions Allah on entering and at his meal,", "zh": "先知(愿主福安之)告诉我们:一个人进家门时和吃饭时记念真主,"}, {"a": 91.64, "b": 95.76, "ar": "قال الشيطان لأصحابه: «لا مبيت لكم ولا عشاء».", "en": "the devil says to his companions: “No place to sleep for you, and no supper.”", "zh": "恶魔就对同伴说:“你们既没有地方过夜,也没有晚饭吃。”"}, {"a": 95.85, "b": 102.28, "ar": "علّموا أطفالكم أن يقولوا: بسم الله عند دخول البيت، وبسم الله على المائدة.", "en": "Teach your children to say “Bismillah” when entering the house, and “Bismillah” at the table.", "zh": "教孩子们进家门时说“奉真主之名”,吃饭时也说“奉真主之名”。"}, {"a": 102.37, "b": 106.77, "ar": "عاداتٌ صغيرة، لكنها تحصّن البيت من الداخل.", "en": "Small habits, but they fortify the home from within.", "zh": "小小的习惯,却能从内部守护整个家。"}, {"a": 106.86, "b": 113.66, "ar": "وأخبر ﷺ أن الشيطان ينفر من البيت الذي تُقرأ فيه سورة البقرة.", "en": "And he (peace be upon him) told us that the devil flees from a house in which Sūrat al-Baqara is recited.", "zh": "他(愿主福安之)还告诉我们,恶魔会逃离诵读《黄牛章》的房子。"}, {"a": 114.11, "b": 122.13, "ar": "فإن لم تستطع قراءتها كاملةً كل يوم، فأسمِع البيت تلاوتها، ودع الصغير ينشأ على صوت القرآن.", "en": "If you can’t recite all of it every day, let the house hear its recitation, and let the little one grow up with the sound of the Qur’an.", "zh": "如果你不能每天读完整章,就让家里播放它的诵读,让孩子在《古兰经》的声音中长大。"}, {"a": 122.7, "b": 126.75, "ar": "ثم تأتي أهم دقائق الليل: لحظة النوم.", "en": "Then come the most important minutes of the night: bedtime.", "zh": "接着是夜里最重要的几分钟:入睡的时刻。"}, {"a": 126.84, "b": 136.0, "ar": "قال ﷺ لأحد أصحابه: «إذا أتيتَ مضجعك فتوضأ وضوءك للصلاة، ثم اضطجع على شقك الأيمن».", "en": "He (peace be upon him) said to one of his Companions: “When you go to bed, make wudūʾ as for prayer, then lie on your right side.”", "zh": "他(愿主福安之)对一位圣门弟子说:“你上床时,要像礼拜一样做小净,然后向右侧卧。”"}, {"a": 136.43, "b": 143.25, "ar": "فإن كان طفلكم كبيرًا فعلّموه ذلك كأنه لعبةٌ لطيفة: وضوء، ثم نومٌ على الجنب الأيمن.", "en": "If your child is older, teach it to him like a gentle game: wudūʾ, then sleeping on the right side.", "zh": "如果孩子大一些,就像玩一个温和的游戏那样教他:先做小净,再向右侧睡。"}, {"a": 143.34, "b": 151.93, "ar": "وكانت عائشة رضي الله عنها تحكي أن النبي ﷺ كان إذا أوى إلى فراشه كل ليلةٍ جمع كفّيه،", "en": "ʿĀʾisha (may Allah be pleased with her) related that every night, when the Prophet (peace be upon him) went to bed, he would join his palms,", "zh": "阿伊莎(愿主喜悦她)讲述:先知(愿主福安之)每晚上床时,会把双手合在一起,"}, {"a": 152.02, "b": 162.95, "ar": "ثم نفث فيهما وقرأ الإخلاص والفلق والناس، ثم مسح بهما ما استطاع من جسده، يبدأ برأسه ووجهه، يفعل ذلك ثلاث مرات.", "en": "blow lightly into them and recite al-Ikhlāṣ, al-Falaq and an-Nās, then wipe over as much of his body as he could, starting with his head and face, doing so three times.", "zh": "轻轻吹气,诵读《忠诚章》《曙光章》《世人章》,然后用双手尽可能抹遍全身,从头和脸开始,这样做三遍。"}, {"a": 163.54, "b": 174.1, "ar": "فاجلسوا كل ليلة بجوار سرير الطفل، واقرؤوا الإخلاص والفلق والناس، وانفثوا في أيديكم، وامسحوا برفق على رأسه ووجهه وجسده،", "en": "So sit by your child’s bed each night, recite al-Ikhlāṣ, al-Falaq and an-Nās, blow into your hands, and gently wipe his head, face and body,", "zh": "所以每晚坐在孩子床边,诵读《忠诚章》《曙光章》《世人章》,向手中轻吹,再轻轻抹他的头、脸和身体,"}, {"a": 174.19, "b": 175.27, "ar": "ثلاثًا.", "en": "three times.", "zh": "三遍。"}, {"a": 175.36, "b": 185.26, "ar": "ثم اقرؤوا آية الكرسي، فمن قرأها عند نومه لم يزل عليه من الله حافظ، ولا يقربه شيطانٌ حتى يصبح.", "en": "Then recite Āyat al-Kursī, for whoever recites it at bedtime has a guardian from Allah over him, and no devil comes near him until morning.", "zh": "然后诵读《宝座节》,谁在睡前诵读它,就有真主派来的守护者守着他,直到天亮恶魔都不会靠近。"}, {"a": 185.35, "b": 189.59, "ar": "واقرؤوا خواتيم سورة البقرة، فمن قرأهما في ليلةٍ كفتاه.", "en": "And recite the closing verses of Sūrat al-Baqara, for whoever recites the two in a night, they suffice him.", "zh": "再诵读《黄牛章》的末尾两节,谁在夜里诵读它们,它们就足够他用了。"}, {"a": 189.68, "b": 194.53, "ar": "وفي الختام، قولوا في أذنه بهدوء، أو قولوها معه إن كان كبيرًا:", "en": "And to finish, say softly in his ear, or say it with him if he is older:", "zh": "最后,在他耳边轻声说,或者孩子大了就和他一起说:"}, {"a": 194.62, "b": 197.28, "ar": "«باسمك اللهم أموت وأحيا».", "en": "“In Your name, O Allah, I die and I live.”", "zh": "“主啊,奉您的名,我死,我生。”"}, {"a": 197.37, "b": 200.79, "ar": "قد تتحول هذه الدقائق إلى أحبّ لحظات يومه:", "en": "These minutes may become the most beloved moments of his day:", "zh": "这几分钟可能会成为他一天中最喜爱的时光:"}, {"a": 200.88, "b": 205.44, "ar": "صوت أمه، ويدٌ تمسح على رأسه، وكلماتٌ تذكّره بالله.", "en": "his mother’s voice, a hand stroking his head, and words that remind him of Allah.", "zh": "妈妈的声音,一只抚摸他头的手,还有让他记起真主的话语。"}, {"a": 205.53, "b": 207.25, "ar": "فإذا استيقظ مذعورًا..", "en": "And if he wakes up frightened...", "zh": "如果他惊醒了……"}, {"a": 207.34, "b": 212.65, "ar": "قال ﷺ: «الرؤيا الصالحة من الله، والحُلُم من الشيطان».", "en": "He (peace be upon him) said: “A good dream is from Allah, and a bad dream is from the devil.”", "zh": "他(愿主福安之)说:“好梦来自真主,噩梦来自恶魔。”"}, {"a": 212.74, "b": 222.11, "ar": "وعلّمنا ما نفعل إذا رأينا ما نكره: أن ننفث عن يسارنا ثلاثًا، ونستعيذ بالله من الشيطان ثلاثًا، ونتحوّل عن الجنب الذي كنا عليه،", "en": "And he taught us what to do when we see what we dislike: blow lightly to our left three times, seek refuge in Allah from the devil three times, and turn from the side we were lying on,", "zh": "他还教我们看到不喜欢的梦时该怎么做:向左边轻吹三次,三次求真主护佑远离恶魔,并翻身换到另一侧,"}, {"a": 222.2, "b": 225.63, "ar": "ولا نحدّث بها أحدًا، فإنها لن تضره.", "en": "and not tell anyone about it, for it will not harm him.", "zh": "也不要把它告诉任何人,这样它就不会伤害他。"}, {"a": 225.72, "b": 230.21, "ar": "فإذا فزع صغيرك من نومه، ضمّه أولًا وهدّئ رَوعه،", "en": "If your little one wakes in fright, hug him first and calm his fear,", "zh": "如果孩子从睡梦中惊醒,先抱住他,平复他的恐惧,"}, {"a": 230.3, "b": 234.76, "ar": "ثم قولا معًا ثلاثًا: أعوذ بالله من الشيطان الرجيم.", "en": "then say together three times: “I seek refuge in Allah from the accursed devil.”", "zh": "然后一起说三遍:“我求真主护佑,免遭被驱逐的恶魔之害。”"}, {"a": 234.85, "b": 239.6, "ar": "وانفثا عن اليسار نفثًا خفيفًا، ثم اقلبه على جنبه الآخر،", "en": "Blow lightly to the left, then turn him onto his other side,", "zh": "向左边轻轻吹气,然后帮他翻到另一侧,"}, {"a": 239.69, "b": 242.58, "ar": "وأعِد عليه آية الكرسي والمعوّذات.", "en": "and recite Āyat al-Kursī and the Muʿawwidhāt over him again.", "zh": "再为他诵读《宝座节》和护佑三章。"}, {"a": 242.67, "b": 248.61, "ar": "وقل: هذا الحلم من الشيطان، والله أقوى من كل شيء، ولن يستطيع أن يؤذيك.", "en": "And say: “This dream is from the devil; Allah is stronger than everything, and it cannot hurt you.”", "zh": "并对他说:“这个梦来自恶魔,真主比一切都强大,它伤害不了你。”"}, {"a": 248.7, "b": 252.85, "ar": "ولا تكثر من سؤاله عن تفاصيل الحلم، بل اصرف قلبه إلى الله.", "en": "Don’t keep asking him about the details of the dream; instead, turn his heart to Allah.", "zh": "不要一直追问梦的细节,而要把他的心引向真主。"}, {"a": 252.94, "b": 259.83, "ar": "ودعاءٌ للأمان من الفزع: رُوي أن النبي ﷺ علّم هذا الدعاء لمن يفزع في نومه،", "en": "And a supplication for safety from fright: it is reported that the Prophet (peace be upon him) taught this supplication to one who is frightened in his sleep,", "zh": "还有一个免于惊恐的祈祷:据传先知(愿主福安之)把这段祈祷词教给睡梦中受惊的人,"}, {"a": 259.92, "b": 270.24, "ar": "وكان عبد الله بن عمرو يعلّمه أبناءه: «أعوذ بكلمات الله التامة من غضبه وعقابه وشرّ عباده، ومن همزات الشياطين وأن يحضرون».", "en": "and ʿAbdullāh ibn ʿAmr used to teach it to his sons: “I seek refuge in the perfect words of Allah from His anger and punishment, from the evil of His servants, and from the whisperings of the devils and from their presence.”", "zh": "阿卜杜拉·本·阿慕尔常把它教给自己的儿子们:“我借真主完美的言辞求护佑,免遭他的恼怒和惩罚,免遭他的仆人之恶,免遭恶魔的唆使和它们的到来。”"}, {"a": 270.33, "b": 280.08, "ar": "ومعه التعويذة التي كان يعوّذ بها الحسن والحسين: «أعيذك بكلمات الله التامة من كل شيطانٍ وهامّة، ومن كل عينٍ لامّة».", "en": "Along with the words he used to protect al-Ḥasan and al-Ḥusayn: “I seek refuge for you in the perfect words of Allah from every devil and harmful creature, and from every evil eye.”", "zh": "以及他为哈桑和侯赛因求护佑的话:“我借真主完美的言辞为你求护佑,远离一切恶魔、一切毒虫和一切邪眼。”"}, {"a": 280.17, "b": 285.5, "ar": "ولنكن صادقين مع أنفسنا: أحيانًا نحن من يكبّر الخوف في قلوب أطفالنا.", "en": "Let’s be honest with ourselves: sometimes we are the ones who make fear grow in our children’s hearts.", "zh": "让我们对自己诚实:有时恰恰是我们让孩子心中的恐惧变大。"}, {"a": 285.59, "b": 289.23, "ar": "أولًا: لا تخوّفوا الأطفال بالجن والغول والبعبع.", "en": "First: don’t frighten children with jinn, ghouls and bogeymen.", "zh": "第一:不要用精灵、妖怪和怪物吓唬孩子。"}, {"a": 289.32, "b": 296.16, "ar": "حين نقول للصغير لنُسكته: سيأتي الجني! فإننا نزرع في قلبه الخوف ذاته الذي يوقظه في الليل.", "en": "When we tell a little one, to quiet him, “The jinn is coming!”, we plant in his heart the very fear that wakes him at night.", "zh": "当我们为了让孩子安静而说“精灵要来了!”,就是在他心里种下那份让他夜里惊醒的恐惧。"}, {"a": 296.57, "b": 301.19, "ar": "قولوا له بدلًا من ذلك: الله يحفظنا، وآية الكرسي تحرسنا.", "en": "Tell him instead: “Allah protects us, and Āyat al-Kursī guards us.”", "zh": "反而要对他说:“真主保护我们,《宝座节》守护我们。”"}, {"a": 301.71, "b": 305.24, "ar": "ثانيًا: كان النبي ﷺ رفيقًا بالصغار،", "en": "Second: the Prophet (peace be upon him) was gentle with children.", "zh": "第二:先知(愿主福安之)对孩子十分温和,"}, {"a": 305.33, "b": 311.83, "ar": "قال لابن عباس وهو غلام: «يا غلام، إني أعلمك كلمات: احفظ الله يحفظك».", "en": "He said to Ibn ʿAbbās when he was a boy: “Young man, I will teach you some words: be mindful of Allah, and He will protect you.”", "zh": "他对还是少年的伊本·阿拔斯说:“孩子,我教你几句话:你谨守真主,真主就会保护你。”"}, {"a": 311.92, "b": 315.24, "ar": "بالحب يخاطب الطفل، وبالله يربط قلبه.", "en": "He addresses the child with love, and ties his heart to Allah.", "zh": "他用爱与孩子说话,把孩子的心与真主连在一起。"}, {"a": 315.33, "b": 317.63, "ar": "ثالثًا: سكينة البيت.", "en": "Third: a calm home.", "zh": "第三:家的安宁。"}, {"a": 317.72, "b": 321.3, "ar": "الطفل الذي ينام على أصوات الشجار لا ينام مطمئنًا.", "en": "A child who falls asleep to the sound of quarrels does not sleep at peace.", "zh": "在争吵声中入睡的孩子,睡不安稳。"}, {"a": 321.39, "b": 324.76, "ar": "قال تعالى: ﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾", "en": "Allah says: “Verily, in the remembrance of Allah do hearts find rest.”", "zh": "真主说:“真的,记念真主,心才能安宁。”"}, {"a": 324.85, "b": 328.21, "ar": "والبيت الذي يُذكر فيه الله تطمئن فيه القلوب.", "en": "And a home in which Allah is remembered is a home where hearts find rest.", "zh": "记念真主的家,人心就会安宁。"}, {"a": 328.3, "b": 334.89, "ar": "وإن اشتدّ خوف الطفل وطال، فتذكّروا قوله ﷺ: «تداووا عباد الله».", "en": "And if the child’s fear becomes severe and lasts long, remember his saying (peace be upon him): “Seek treatment, servants of Allah.”", "zh": "如果孩子的恐惧加重并持续很久,请记住他(愿主福安之)的话:“真主的仆人们,你们要就医。”"}, {"a": 334.98, "b": 339.93, "ar": "فالرقية والذكر يسيران مع سائر الأسباب، لا يحلّان محلّها.", "en": "Ruqyah and dhikr go along with all other means; they do not replace them.", "zh": "诵经祛病和赞念与其他一切措施并行,而不是取代它们。"}, {"a": 340.02, "b": 342.87, "ar": "وإليكم برنامج الليل باختصار:", "en": "Here is the night plan in brief:", "zh": "下面简要总结夜间方案:"}, {"a": 342.96, "b": 350.21, "ar": "عند الغروب: أبقوا الصغار في البيت، وأغلقوا الأبواب بقول: بسم الله، وعلى العشاء: بسم الله.", "en": "At sunset: keep the little ones home, close the doors saying “Bismillah”, and at supper: “Bismillah”.", "zh": "日落时:让孩子待在家里,关门时念“奉真主之名”,吃晚饭时也念“奉真主之名”。"}, {"a": 350.3, "b": 357.56, "ar": "وقبل النوم: وضوء، ونومٌ على الجنب الأيمن، وبجوار السرير المعوّذات مع النفث والمسح ثلاثًا،", "en": "Before sleep: wudūʾ, sleeping on the right side, and by the bed, the Muʿawwidhāt with blowing and wiping three times,", "zh": "睡前:做小净,向右侧卧,在床边诵读护佑三章,轻吹并抚摸三遍,"}, {"a": 357.65, "b": 362.81, "ar": "ثم آية الكرسي وخواتيم البقرة، ثم: باسمك اللهم أموت وأحيا.", "en": "then Āyat al-Kursī and the end of al-Baqara, then: “In Your name, O Allah, I die and I live.”", "zh": "然后诵读《宝座节》和《黄牛章》末尾,再说:“主啊,奉您的名,我死,我生。”"}, {"a": 363.25, "b": 371.54, "ar": "وإن استيقظ فزعًا: حضنٌ، واستعاذةٌ ثلاثًا، ونفثٌ عن اليسار، وتحويلٌ للجنب، وإعادةٌ لآية الكرسي.", "en": "And if he wakes in fright: a hug, seeking refuge three times, blowing to the left, turning onto the other side, and reciting Āyat al-Kursī again.", "zh": "如果他惊醒:拥抱他,三次求护佑,向左轻吹,翻身换侧,再诵读一遍《宝座节》。"}, {"a": 372.09, "b": 379.82, "ar": "طفلك أمانةٌ بين يديك، وحين تُغمض عيناه في الليل لا يبقى معه إلا الذكر الذي قرأته عليه.", "en": "Your child is a trust in your hands, and when his eyes close at night, nothing stays with him but the dhikr you recited over him.", "zh": "孩子是你手中的托付;当他夜里闭上双眼,陪伴他的只有你为他诵读的赞念。"}, {"a": 379.91, "b": 385.82, "ar": "فاجلس الليلة بجوار سريره، وامسح على رأسه، واستودعه خير حافظ: الله.", "en": "So sit by his bed tonight, stroke his head, and entrust him to the best Protector: Allah.", "zh": "所以今晚就坐在他的床边,抚摸他的头,把他托付给最好的保护者——真主。"}, {"a": 385.91, "b": 389.42, "ar": "شارك هذا المقطع مع كل أبٍ وأمٍّ أتعبهم السهر،", "en": "Share this clip with every father and mother worn out by sleepless nights,", "zh": "把这段视频分享给每一位被熬夜折磨的父亲和母亲,"}, {"a": 389.51, "b": 394.55, "ar": "واكتب في التعليقات: اللهم اجعل ليالي أطفالنا سكينةً وأمانًا.", "en": "and write in the comments: “O Allah, make our children’s nights peaceful and safe.”", "zh": "并在评论中写下:“真主啊,求您让我们孩子的夜晚安宁而平安。”"}, {"a": 394.64, "b": 395.54, "ar": "آمين.", "en": "Amen.", "zh": "阿敏。"}], SECS = [{"a": 0.0, "b": 26.7, "ar": "ليلةٌ بعد ليلة", "en": "Night after night", "col": "#cfc0ea", "ic": "babycry", "items": [[1.5, "c", "صراخ من غرفة الصغار", "w", "warn", 0], [8.5, "c", "يشير: هناك شيء!", "y", "eye", 0], [12.2, "c", "تضمّه وتهدّئه", "g", "heart", 0], [14.4, "c", "وتتكرر القصة كل ليلة", "p", "moon", 0], [18.7, "c", "كان ينام قرير العين", "g", "baby", 1], [21.1, "c", "صار يخاف الظلام", "w", "moon", 1], [22.7, "c", "لا يقبل أن يبقى وحده", "w", "x", 1], [24.5, "c", "يستيقظ مرات في الليل", "p", "clock", 1]]}, {"a": 26.7, "b": 43.45, "ar": "في هذه الحلقة", "en": "In this episode", "col": "#9fd3d6", "ic": "moon", "items": [[30.7, "c", "هدي النبي ﷺ في ليل الأطفال", "y", "book", 0], [35.5, "c", "من الغروب", "w", "sunset", 0], [36.9, "c", "إلى لحظة النوم", "w", "bed", 0], [38.4, "c", "إلى الاستيقاظ من حلم مخيف", "p", "babycry", 0]]}, {"a": 43.45, "b": 80.6, "num": "١", "ar": "ساعة الغروب", "en": "The hour of sunset", "col": "#f5b88a", "ic": "sunset", "items": [[46.0, "c", "عند جُنح الليل", "w", "moon", 0], [48.9, "q", "«إِذَا كَانَ جُنْحُ اللَّيْلِ فَكُفُّوا صِبْيَانَكُمْ»", "w",
